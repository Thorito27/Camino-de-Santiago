<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Las Lolitas al Camino · Sarria → Santiago 2026</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Las Lolitas al Camino · Sarria → Santiago 2026">
<meta property="og:description" content="Seis etapas del 18 al 23 de agosto, con la guía de la tita Lucila. Mapa, perfil, tiempo, horarios y alojamientos de cada día.">
<meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Catedral_de_Santiago_de_Compostela%2C_Espa%C3%B1a%2C_2015-09-23%2C_DD_39-41_HDR.JPG/1200px-Catedral_de_Santiago_de_Compostela%2C_Espa%C3%B1a%2C_2015-09-23%2C_DD_39-41_HDR.JPG">
<meta property="og:locale" content="es_ES">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1B2A23">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--tinta:#1B2A23;--pizarra:#2E4038;--musgo:#4A6B52;--piedra:#B5AE9E;
  --hueso:#EDE8DC;--papel:#F7F4EC;--concha:#D8A33C;--alerta:#B5482F;--radio:3px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--tinta);color:var(--hueso);
  overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-rows:auto auto auto auto 1fr;height:100%}
header{background:var(--tinta);border-bottom:1px solid rgba(237,232,220,.12);
  padding:.55rem .9rem .45rem;display:flex;align-items:center;gap:1rem;z-index:20}
.marca{display:flex;flex-direction:column;line-height:1.05;flex-shrink:0}
.marca b{font-family:'Fraunces',serif;font-weight:800;font-size:1.02rem;letter-spacing:-.015em}
.marca span{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--piedra);
  letter-spacing:.08em;text-transform:uppercase;margin-top:.15rem}
#btnHoy{margin:0 auto;font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;background:var(--concha);color:var(--tinta);
  border:none;padding:.5rem 1.15rem;border-radius:var(--radio);cursor:pointer;
  transition:transform .12s,box-shadow .12s;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#btnHoy:hover{transform:translateY(-1px);box-shadow:0 3px 0 rgba(0,0,0,.3)}
#btnHoy:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
#btnHoy:focus-visible{outline:2px solid var(--hueso);outline-offset:2px}
.cuenta{font-family:'JetBrains Mono',monospace;font-size:.63rem;color:var(--piedra);
  text-align:right;line-height:1.35;flex-shrink:0}
.cuenta b{color:var(--concha);font-size:.8rem;display:block}
nav{display:flex;background:var(--pizarra);overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid rgba(237,232,220,.1)}
nav::-webkit-scrollbar{display:none}
nav button{flex:1;min-width:88px;background:none;border:none;border-bottom:3px solid transparent;
  color:var(--piedra);cursor:pointer;padding:.5rem .4rem .45rem;font-family:'Inter',sans-serif;
  font-size:.7rem;transition:color .15s,background .15s;text-align:center;line-height:1.25}
nav button .n{display:block;font-family:'JetBrains Mono',monospace;font-size:.58rem;
  letter-spacing:.1em;opacity:.65}
nav button .d{display:block;font-weight:500;margin-top:.1rem}
nav button:hover{color:var(--hueso);background:rgba(237,232,220,.05)}
nav button[aria-selected="true"]{color:var(--hueso);background:rgba(237,232,220,.08);
  border-bottom-color:var(--et,var(--concha))}
nav button:focus-visible{outline:2px solid var(--concha);outline-offset:-2px}
main{display:grid;grid-template-columns:minmax(310px,400px) 1fr;overflow:hidden}
#col{display:flex;flex-direction:column;background:var(--papel);overflow:hidden}
#subnav{display:flex;background:#E8E2D2;border-bottom:1px solid #D5CEBB;flex-shrink:0}
#subnav button{flex:1;background:none;border:none;border-bottom:2px solid transparent;
  padding:.48rem .3rem;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.6rem;
  letter-spacing:.07em;text-transform:uppercase;color:#7C776B;transition:color .13s,background .13s}
#subnav button:hover{background:rgba(0,0,0,.04);color:var(--tinta)}
#subnav button[aria-selected="true"]{color:var(--tinta);background:var(--papel);
  border-bottom-color:var(--et,var(--musgo));font-weight:600}
#subnav button:focus-visible{outline:2px solid var(--musgo);outline-offset:-2px}
#panel{color:var(--tinta);overflow-y:auto;overscroll-behavior:contain;padding:1.1rem 1.15rem 3rem;flex:1}
#mapa{position:relative;background:var(--pizarra)}
.et-cab{border-bottom:2px solid var(--et,var(--musgo));padding-bottom:.7rem;margin-bottom:.9rem}
.et-cab .fecha{font-family:'JetBrains Mono',monospace;font-size:.64rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--et,var(--musgo));font-weight:600}
.et-cab h1{font-family:'Fraunces',serif;font-weight:600;font-size:1.42rem;line-height:1.12;
  letter-spacing:-.02em;margin:.28rem 0 .45rem}
.et-cab h1 em{font-style:normal;color:var(--et,var(--musgo))}
.metricas{display:flex;gap:1.3rem;flex-wrap:wrap}
.metrica{line-height:1.15}
.metrica b{font-family:'JetBrains Mono',monospace;font-size:1.02rem;font-weight:600;display:block}
.metrica span{font-size:.57rem;letter-spacing:.09em;text-transform:uppercase;color:#7C776B}
.metrica.sube b{color:var(--alerta)}
.metrica.baja b{color:var(--musgo)}
h2{font-family:'JetBrains Mono',monospace;font-size:.63rem;letter-spacing:.15em;
  text-transform:uppercase;color:#7C776B;font-weight:600;margin:1.5rem 0 .55rem;
  display:flex;align-items:center;gap:.5rem}
h2:first-child{margin-top:0}
h2::after{content:'';flex:1;height:1px;background:#DED8C9}
.perfil{background:#fff;border:1px solid #E2DCCC;border-radius:var(--radio);
  padding:.6rem .5rem .35rem;position:relative}
.perfil svg{display:block;width:100%;height:auto}
.perfil .lbl{font-family:'JetBrains Mono',monospace;font-size:.56rem;fill:#9B958A}
.perfil .cota{font-family:'JetBrains Mono',monospace;font-size:.54rem;fill:#7C776B}
.perfil-pie{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;
  font-size:.57rem;color:#9B958A;padding:.25rem .3rem 0}
.slider-caja{background:var(--tinta);color:var(--hueso);border-radius:var(--radio);
  padding:.7rem .8rem;margin-top:.5rem}
.slider-caja input[type=range]{width:100%;margin:.5rem 0 .3rem;accent-color:var(--concha);cursor:grab}
.slider-caja input[type=range]:active{cursor:grabbing}
.slider-datos{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;text-align:center}
.slider-datos div{line-height:1.2}
.slider-datos b{font-family:'JetBrains Mono',monospace;font-size:.82rem;display:block}
.slider-datos span{font-size:.53rem;letter-spacing:.07em;text-transform:uppercase;color:var(--piedra)}
.timing{list-style:none}
.timing li{display:grid;grid-template-columns:4.4rem 1fr;gap:.65rem;padding:.42rem 0;
  border-bottom:1px solid #E5DFD0;font-size:.79rem;line-height:1.42}
.timing li:last-child{border-bottom:none}
.timing .h{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:600;
  color:var(--et,var(--musgo));padding-top:.1rem}
.timing li.destacado{background:linear-gradient(90deg,rgba(216,163,60,.16),transparent 82%);
  margin:0 -.5rem;padding:.42rem .5rem;border-radius:var(--radio)}
.dudoso{display:block;margin-top:.28rem;font-size:.68rem;line-height:1.35;color:var(--alerta);
  padding-left:.6rem;border-left:2px solid var(--alerta)}
.hitos{list-style:none;display:flex;flex-direction:column;gap:.3rem}
.hito{width:100%;text-align:left;background:#fff;border:1px solid #E2DCCC;
  border-left:3px solid var(--c,var(--piedra));border-radius:var(--radio);padding:.5rem .65rem;
  cursor:pointer;font-family:inherit;transition:border-color .13s,transform .13s;
  display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:baseline}
.hito:hover{border-color:var(--c,var(--musgo));transform:translateX(2px)}
.hito:focus-visible{outline:2px solid var(--musgo);outline-offset:1px}
.hito .nom{font-size:.79rem;font-weight:500;line-height:1.3}
.hito .km{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:#7C776B;white-space:nowrap}
.hito .tag{grid-column:1/-1;font-size:.6rem;letter-spacing:.07em;text-transform:uppercase;
  color:var(--c,#7C776B);font-weight:600;margin-top:.1rem}
.hito .ficha{grid-column:1/-1;font-size:.71rem;line-height:1.45;color:#4A463D;margin-top:.35rem;display:none}
.hito[aria-expanded="true"] .ficha{display:block}
.hito .sello{display:inline-block;font-size:.56rem;font-weight:600;letter-spacing:.08em;
  background:var(--concha);color:var(--tinta);padding:.08rem .32rem;border-radius:2px;
  margin-left:.3rem;vertical-align:.05em}
.hito .llegada{grid-column:1/-1;font-family:'JetBrains Mono',monospace;font-size:.62rem;
  color:var(--musgo);margin-top:.2rem}
.bloque{font-size:.78rem;line-height:1.55}
.bloque ul{list-style:none;display:flex;flex-direction:column;gap:.4rem}
.bloque li{padding-left:.85rem;position:relative}
.bloque li::before{content:'';position:absolute;left:0;top:.55em;width:4px;height:4px;
  border-radius:50%;background:var(--et,var(--musgo))}
.sub{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:#7C776B;
  font-weight:600;margin:.8rem 0 .35rem}
.dl{display:grid;grid-template-columns:auto 1fr;gap:.25rem .7rem;font-size:.76rem}
.dl dt{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.06em;
  text-transform:uppercase;color:#7C776B;padding-top:.15rem}
.dl dd{line-height:1.45}
.dl a{color:var(--musgo)}
.nota{font-size:.71rem;line-height:1.45;background:#fff;border:1px solid #E2DCCC;
  border-left:3px solid var(--piedra);padding:.5rem .65rem;border-radius:var(--radio);margin-top:.45rem}
.nota.roja{border-left-color:var(--alerta);background:#FCF3F0}
.nota.roja::before{content:'Sin verificar · ';font-weight:600;color:var(--alerta);
  font-size:.62rem;letter-spacing:.06em;text-transform:uppercase}
.nota.km::before{content:'Los km no cuadran · ';font-weight:600;color:var(--alerta);
  font-size:.62rem;letter-spacing:.06em;text-transform:uppercase}
/* Previsión que llega de Open-Meteo pero está lejos en el tiempo: el dato es
   real, la confianza es poca. Ni verde (fiable) ni roja (sin verificar). */
.nota.lejos{border-left-color:var(--concha);background:#FBF3E2}
.nota.lejos::before{content:'Orientativa · ';font-weight:600;color:#8A6A1E;
  font-size:.62rem;letter-spacing:.06em;text-transform:uppercase}
.meteo-h .lejos-tag{font-family:'JetBrains Mono',monospace;font-size:.55rem;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:#8A6A1E;background:#FBF3E2;
  padding:.08rem .3rem;border-radius:100px;margin-left:.3rem}
.portada-mapa{width:100%;height:auto;display:block;border-radius:var(--radio);margin:.4rem 0 .2rem}
.portada .lead{font-size:.9rem;line-height:1.6;color:var(--pizarra);margin-top:.7rem}
.portada p{font-size:.82rem;line-height:1.62;margin-top:.55rem}
.portada strong{font-weight:600;color:var(--tinta)}
.portada a{color:var(--musgo);font-weight:600}
.portada .nota strong{color:var(--tinta)}
/* "¿Quién eres?" en la portada. Va pegado al saludo, antes de que empiece
   el texto largo: si cae más abajo no lo ve nadie. */
.quien-portada{display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  flex-wrap:wrap;margin-top:.7rem;padding:.6rem .7rem;background:#fff;
  border:1px solid #E2DCCC;border-left:3px solid var(--concha);border-radius:var(--radio)}
.quien-portada .quien-eres{font-family:'Fraunces',serif;font-weight:600;font-size:.86rem;
  color:var(--tinta)}
.quien-portada .quien-btn{flex-shrink:0;font-family:'JetBrains Mono',monospace;
  font-size:.64rem;font-weight:600;letter-spacing:.02em;color:#fff;background:var(--musgo);
  border:0;padding:.42rem .7rem;border-radius:var(--radio);cursor:pointer}
.quien-portada .quien-btn:hover{background:#3B5641}
.quien-portada .quien-btn:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
/* Las opciones para mover los coches. SIN numerar a propósito: son
   alternativas entre las que hay que elegir, no los pasos de un plan ya
   decidido. Estuvo un rato como <ol> y daba a entender lo contrario. */
.portada ul.coches{margin:.55rem 0 .2rem;padding-left:1.1rem;list-style:none}
.portada ul.coches li{font-size:.82rem;line-height:1.62;margin-top:.5rem;position:relative;
  padding-left:.75rem}
.portada ul.coches li::before{content:'';position:absolute;left:0;top:.55em;width:.35rem;
  height:.35rem;border-radius:50%;background:var(--concha)}
.portada-cta{display:block;width:100%;margin:1.2rem 0 .3rem;padding:.9rem 1rem;
  font-family:'Fraunces',serif;font-weight:600;font-size:1.08rem;text-align:center;
  color:var(--tinta);background:var(--concha);border:none;border-radius:var(--radio);cursor:pointer}
.portada-cta:hover{background:#E2AE49}
.portada-cta:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.portada .firma{text-align:center;font-family:'Fraunces',serif;font-style:italic;
  color:var(--musgo);font-size:.9rem;margin-top:.2rem}
/* Retos: elegir persona, avisos y compartir */
.personas{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));
  gap:.4rem;margin-top:.6rem}
.persona{background:#fff;border:1px solid #E2DCCC;border-left:3px solid var(--concha);
  border-radius:var(--radio);padding:.6rem .5rem;font-family:'Fraunces',serif;
  font-weight:600;font-size:.86rem;color:var(--tinta);cursor:pointer;
  transition:border-color .13s,transform .13s}
.persona:hover{border-color:var(--musgo);transform:translateY(-1px)}
.persona:focus-visible{outline:2px solid var(--musgo);outline-offset:1px}
/* El que ya está elegido, marcado: en la ventana se ve la lista entera y
   sin esto no hay forma de saber cuál eres. */
.persona.elegida{background:#EAF1EA;border-color:var(--musgo);border-left-color:var(--musgo)}
.persona.elegida::after{content:' ✓';color:var(--musgo)}
.reto-aviso{margin-top:.4rem;font-family:'JetBrains Mono',monospace;font-size:.6rem;
  letter-spacing:.04em;color:var(--alerta)}
.reto-mencion{background:var(--tinta);color:var(--concha);border-radius:var(--radio);
  padding:.45rem .7rem;margin-top:.5rem;font-family:'Fraunces',serif;font-weight:600;
  font-size:.85rem}
.reto-wa{display:block;width:100%;margin-top:.6rem;padding:.6rem .8rem;border:none;
  border-radius:var(--radio);background:var(--musgo);color:#fff;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:.66rem;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase}
.reto-wa:hover{background:#3B5641}
.reto-wa:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.reto-pie{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem;padding-top:.7rem;
  border-top:1px solid #DED8C9}
/* Retos: tarjetas al estilo de los sellos */
.retos{list-style:none;display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem}
.reto{background:#fff;border:1px solid #E2DCCC;border-left:3px solid var(--concha);
  border-radius:var(--radio);padding:.6rem .7rem}
.reto.bien{border-left-color:var(--musgo)}
.reto.mal{border-left-color:var(--alerta)}
.reto-p{font-size:.8rem;line-height:1.45;font-weight:500;color:var(--tinta)}
.reto-ops{display:flex;flex-direction:column;gap:.3rem;margin-top:.5rem}
.reto-op{width:100%;text-align:left;background:#FAF8F2;border:1px solid #D5CEBB;
  border-radius:var(--radio);padding:.45rem .6rem;font-family:inherit;font-size:.76rem;
  line-height:1.35;color:var(--tinta);cursor:pointer;transition:border-color .13s,background .13s}
.reto-op:hover:not(:disabled){border-color:var(--musgo);background:#fff}
.reto-op:focus-visible{outline:2px solid var(--musgo);outline-offset:1px}
.reto-op:disabled{cursor:default}
.reto-op.ok{background:#EAF1EA;border-color:var(--musgo);font-weight:600}
.reto-op.ko{background:#FCF3F0;border-color:var(--alerta)}
.reto-rev{margin-top:.5rem;font-size:.74rem;line-height:1.5;color:#4A463D;
  background:#F7F4EC;border-radius:var(--radio);padding:.5rem .6rem}
.reto-tanda{background:#fff;border:1px solid #E2DCCC;border-radius:var(--radio);
  padding:.6rem .7rem;margin-top:.5rem}
.reto-tanda.bloqueada{background:#F2EFE6;border-style:dashed}
.reto-tanda-t{font-family:'Fraunces',serif;font-weight:600;font-size:.88rem;
  color:var(--tinta);line-height:1.25}
.reto-tanda-s{font-family:'JetBrains Mono',monospace;font-size:.63rem;letter-spacing:.03em;
  color:#7C776B;margin-top:.22rem}
.reto-pistas{list-style:none;margin-top:.45rem;display:flex;flex-direction:column;gap:.25rem}
.reto-pistas li{font-size:.74rem;line-height:1.4;color:#5A554A;padding-left:.75rem;position:relative}
.reto-pistas li::before{content:'·';position:absolute;left:.15rem;color:var(--concha);font-weight:700}
.reto-marcador{display:inline-flex;align-items:baseline;gap:.4rem;background:var(--tinta);
  color:var(--hueso);border-radius:var(--radio);padding:.3rem .6rem;margin-top:.35rem}
.reto-marcador b{font-family:'JetBrains Mono',monospace;font-size:.85rem}
.reto-marcador span{font-size:.6rem;letter-spacing:.07em;text-transform:uppercase;color:var(--piedra)}
/* Grupo del equipaje que NO viene de la guía: en hueso y con borde, para que
   se distinga a simple vista de los que sí son de la tita Lucila. */
.reto-marcador.fuera{background:none;border:1px dashed #C4BCA6;color:var(--tinta)}
.reto-marcador.fuera span{color:#7C776B}
.decisiones{display:flex;flex-direction:column;gap:.5rem;margin-top:.5rem}
.decision{background:#fff;border:1px solid #E2DCCC;border-left:3px solid var(--alerta);
  border-radius:var(--radio);padding:.6rem .7rem}
.decision.encurso{border-left-color:var(--concha)}
.decision.resuelto{border-left-color:var(--musgo)}
.decision h3{font-family:'Fraunces',serif;font-weight:600;font-size:.92rem;color:var(--tinta);
  line-height:1.25;display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.decision .estado{flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:.56rem;
  font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:.14rem .42rem;
  border-radius:100px;margin-top:.1rem}
.decision .estado.pendiente{background:#FCF3F0;color:var(--alerta)}
.decision .estado.encurso{background:#FBF3E2;color:#8A6A1E}
.decision .estado.resuelto{background:#EAF1EA;color:var(--musgo)}
.decision p{font-size:.75rem;line-height:1.5;color:#4A463D;margin-top:.4rem}
.decision .cuando{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.03em;
  color:#7C776B;margin-top:.3rem}
/* La respuesta del grupo. La frase literal va en <q> y lo que hemos
   entendido de ella en .aclara, separado a propósito: no se mezcla lo
   que alguien dijo con lo que nosotros dedujimos. */
.decision .resp{margin-top:.55rem;padding:.45rem .6rem;background:var(--papel);
  border-left:2px solid var(--piedra);border-radius:2px}
.decision .resp q{font-size:.75rem;line-height:1.5;color:var(--tinta);font-style:italic}
.decision .resp .quien{display:block;margin-top:.3rem;font-family:'JetBrains Mono',monospace;
  font-size:.58rem;letter-spacing:.03em;text-transform:uppercase;color:#7C776B}
.decision .resp .aclara{margin-top:.4rem;font-size:.73rem;line-height:1.45;color:#4A463D}
.decision .wa{display:inline-block;margin-top:.55rem;font-family:'JetBrains Mono',monospace;
  font-size:.64rem;font-weight:600;letter-spacing:.02em;text-decoration:none;color:#fff;
  background:var(--musgo);padding:.4rem .65rem;border-radius:var(--radio)}
.decision .wa:hover{background:#3B5641}
.decision .wa:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.marcha{background:var(--tinta);color:var(--hueso);border-radius:var(--radio);
  padding:.75rem .8rem;margin-top:.5rem}
.marcha .fila{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.marcha .fila+.fila{margin-top:.4rem;padding-top:.4rem;border-top:1px solid rgba(237,232,220,.14)}
.marcha .lbl{font-size:.68rem;color:var(--piedra)}
.marcha .val{font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:600}
.marcha .pie{font-size:.62rem;line-height:1.4;color:var(--piedra);margin-top:.6rem;
  padding-top:.5rem;border-top:1px solid rgba(237,232,220,.14)}
.marcha code{background:rgba(237,232,220,.12);padding:.05rem .25rem;border-radius:2px;
  font-family:'JetBrains Mono',monospace;font-size:.95em}
.meteo-estado{font-size:.73rem;line-height:1.5;background:#fff;border:1px solid #E2DCCC;
  border-radius:var(--radio);padding:.7rem .75rem;color:#5A554A}
.meteo-grid{display:flex;flex-direction:column;gap:.3rem}
.meteo-h{display:grid;grid-template-columns:3.1rem 1.7rem 1fr auto;gap:.5rem;align-items:center;
  background:#fff;border:1px solid #E2DCCC;border-radius:var(--radio);padding:.42rem .6rem;font-size:.75rem}
.meteo-h .hh{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:600;color:#7C776B}
.meteo-h .ic{font-size:1.1rem;text-align:center;line-height:1}
.meteo-h .tt{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:.86rem}
.meteo-h .ds{font-size:.67rem;color:#7C776B;line-height:1.3}
.meteo-h .pp{font-family:'JetBrains Mono',monospace;font-size:.66rem;color:#3D5A73;white-space:nowrap}
.meteo-h.calor{border-left:3px solid var(--alerta)}
.meteo-h.moja{border-left:3px solid #3D5A73}
.meteo-resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.5rem}
.meteo-resumen div{background:var(--tinta);color:var(--hueso);border-radius:var(--radio);
  padding:.55rem .4rem;text-align:center;line-height:1.2}
.meteo-resumen b{font-family:'JetBrains Mono',monospace;font-size:1rem;display:block}
.meteo-resumen span{font-size:.53rem;letter-spacing:.07em;text-transform:uppercase;color:var(--piedra)}
.cargando{display:inline-block;width:11px;height:11px;border:2px solid #DED8C9;
  border-top-color:var(--musgo);border-radius:50%;animation:giro .7s linear infinite;
  vertical-align:-1px;margin-right:.4rem}
@keyframes giro{to{transform:rotate(360deg)}}
.btn-recargar{background:none;border:1px solid #D5CEBB;border-radius:var(--radio);
  padding:.35rem .7rem;font-family:'JetBrains Mono',monospace;font-size:.62rem;
  letter-spacing:.06em;text-transform:uppercase;color:#7C776B;cursor:pointer;margin-top:.5rem}
.btn-recargar:hover{border-color:var(--musgo);color:var(--tinta)}
.tabla{width:100%;border-collapse:collapse;font-size:.74rem}
.tabla th{font-family:'JetBrains Mono',monospace;font-size:.56rem;letter-spacing:.08em;
  text-transform:uppercase;color:#7C776B;font-weight:600;text-align:right;padding:.3rem .35rem;
  border-bottom:1px solid #DED8C9}
.tabla th:first-child{text-align:left}
.tabla td{padding:.38rem .35rem;border-bottom:1px solid #E9E3D4;text-align:right;
  font-family:'JetBrains Mono',monospace;font-size:.71rem}
.tabla td:first-child{text-align:left;font-family:'Inter',sans-serif}
.tabla tr:hover td{background:rgba(74,107,82,.06)}
.tabla .pt{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:.4rem}
.tabla tfoot td{font-weight:600;border-top:2px solid #DED8C9;border-bottom:none;padding-top:.5rem}
.tabla button{background:none;border:none;font:inherit;color:inherit;cursor:pointer;
  padding:0;text-align:left;width:100%}
.tabla button:hover{color:var(--musgo);text-decoration:underline}
.mk{font-family:'JetBrains Mono',monospace;display:flex;align-items:center;
  justify-content:center;cursor:pointer;user-select:none}
.mk-et{width:31px;height:31px;border-radius:50%;color:#fff;font-size:.82rem;font-weight:600;
  border:2.5px solid rgba(255,255,255,.92);box-shadow:0 2px 7px rgba(0,0,0,.42);transition:transform .14s}
.mk-et:hover{transform:scale(1.14)}
.mk-pt{width:15px;height:15px;border-radius:50%;border:2.5px solid #fff;
  box-shadow:0 1px 5px rgba(0,0,0,.45);transition:transform .14s}
.mk-pt:hover{transform:scale(1.42)}
.mk-pt.grande{width:21px;height:21px;border-width:3px}
.mk-pt.mk-fuera{border-style:dashed;border-color:#EDE8DC;box-shadow:0 0 0 2px rgba(216,163,60,.55),0 1px 5px rgba(0,0,0,.45)}
.mk-pos{width:17px;height:17px;border-radius:50%;background:var(--concha);border:3px solid #fff;
  box-shadow:0 0 0 3px rgba(216,163,60,.35),0 2px 6px rgba(0,0,0,.5)}
.mk-lbl{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;
  white-space:nowrap;font-family:'Inter',sans-serif;font-size:.63rem;font-weight:500;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.8);pointer-events:none}
#capas{position:absolute;top:8px;left:8px;z-index:6;display:flex;gap:.25rem}
#capas button,#capas span{background:rgba(27,42,35,.82);border:1px solid rgba(237,232,220,.28);
  color:var(--hueso);font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:600;
  letter-spacing:.05em;padding:.35rem .55rem;border-radius:var(--radio);cursor:pointer;
  backdrop-filter:blur(3px);transition:background .13s,border-color .13s}
#capas button:hover{border-color:var(--concha)}
#capas button.on,#capas span.on{background:var(--concha);color:var(--tinta);border-color:var(--concha)}
#capas button:focus-visible{outline:2px solid var(--concha);outline-offset:1px}
.attr{position:absolute;bottom:5px;left:8px;z-index:5;font-family:'JetBrains Mono',monospace;
  font-size:.56rem;color:rgba(255,255,255,.72);text-shadow:0 1px 3px rgba(0,0,0,.9);
  pointer-events:none;line-height:1.5}
#verMapa{display:none;position:fixed;bottom:1rem;right:1rem;z-index:30;background:var(--concha);
  color:var(--tinta);border:none;font-family:'JetBrains Mono',monospace;font-size:.68rem;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.7rem 1.1rem;
  border-radius:var(--radio);box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer}

/* Botón "mi ubicación" sobre el mapa: activa/centra la geolocalización.
   Abajo a la derecha; en móvil sube para no chocar con "Ver ficha". El estado
   visual (inactiva/buscando/siguiendo) lo pinta Geo, igual que en #btnGeo. */
#miUbi{position:absolute;right:10px;bottom:42px;z-index:8;width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;background:rgba(27,42,35,.86);
  border:1px solid rgba(237,232,220,.3);border-radius:50%;color:var(--hueso);cursor:pointer;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  box-shadow:0 2px 8px rgba(0,0,0,.4);transition:background .15s,border-color .15s,color .15s}
#miUbi:hover{border-color:var(--concha)}
#miUbi svg{width:22px;height:22px;display:block}
#miUbi.buscando{border-color:var(--concha);color:var(--concha)}
#miUbi.buscando svg{animation:girar 1s linear infinite;transform-origin:50% 50%}
#miUbi.activo{background:var(--musgo);border-color:var(--musgo);color:#fff}
#miUbi:focus-visible{outline:2px solid var(--concha);outline-offset:2px}
@keyframes girar{to{transform:rotate(360deg)}}

/* --- Geolocalización --- */
#btnGeo{font-family:'JetBrains Mono',monospace;font-size:.63rem;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;background:none;color:var(--piedra);
  border:1px solid rgba(237,232,220,.3);padding:.42rem .7rem;border-radius:var(--radio);
  cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
#btnGeo:hover{border-color:var(--concha);color:var(--hueso)}
#btnGeo.buscando{border-color:var(--concha);color:var(--concha)}
#btnGeo.activo{background:var(--musgo);border-color:var(--musgo);color:#fff}
#btnGeo:focus-visible{outline:2px solid var(--concha);outline-offset:2px}
#barraGeo{display:none;background:var(--musgo);color:#fff;padding:.55rem .8rem;
  border-bottom:1px solid rgba(0,0,0,.2);flex-shrink:0}
.geo-fila{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;text-align:center}
.geo-dato b{font-family:'JetBrains Mono',monospace;font-size:.95rem;display:block;line-height:1.1}
.geo-dato span{font-size:.5rem;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.geo-sig{margin-top:.5rem;padding-top:.45rem;border-top:1px solid rgba(255,255,255,.25);
  display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.geo-sig .lbl{font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.geo-sig b{font-size:.85rem}
.geo-sig .det{font-family:'JetBrains Mono',monospace;font-size:.7rem;opacity:.9;margin-left:auto}
.geo-aviso{background:rgba(181,72,47,.9);margin:-.55rem -.8rem .5rem;padding:.4rem .8rem;
  font-size:.7rem;line-height:1.35}
.geo-acciones{display:flex;gap:.35rem;margin-top:.5rem;flex-wrap:wrap}
.geo-acciones button{flex:1;min-width:90px;background:rgba(255,255,255,.15);border:none;
  color:#fff;font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.05em;
  text-transform:uppercase;padding:.35rem .3rem;border-radius:var(--radio);cursor:pointer}
.geo-acciones button:hover{background:rgba(255,255,255,.28)}
.mk-yo{width:20px;height:20px;border-radius:50%;background:#2E7D32;border:3px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.5);position:relative}
.mk-yo .pulso{position:absolute;inset:-9px;border-radius:50%;border:2px solid #2E7D32;
  animation:pulsa 2s ease-out infinite}
@keyframes pulsa{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}

/* --- Teléfonos --- */
.tels{display:flex;flex-direction:column;gap:.3rem}
.tel{display:flex;justify-content:space-between;align-items:center;gap:.6rem;
  background:#fff;border:1px solid #E2DCCC;border-left:3px solid var(--musgo);
  border-radius:var(--radio);padding:.5rem .65rem;text-decoration:none;color:var(--tinta);
  transition:border-color .13s,transform .13s}
.tel:hover{border-color:var(--musgo);transform:translateX(2px)}
.tel.sin{border-left-color:var(--piedra);opacity:.65}
.tel-n{font-size:.76rem;font-weight:500;line-height:1.3}
.tel-n em{font-style:normal;font-size:.66rem;color:#7C776B;font-weight:400}
.tel-t{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:600;
  color:var(--musgo);white-space:nowrap}
.tel.sin .tel-t{color:#9B958A;font-weight:400;font-size:.68rem}

/* --- Escapes --- */
.hito.escape{border-left-color:var(--alerta);background:#FDF7F5}
.hito .restante{color:var(--musgo);font-weight:600}
.hito .pasado{color:#9B958A;font-style:italic}

/* --- Sellos --- */
.sellos-estado{display:flex;align-items:center;gap:.7rem;background:var(--tinta);
  color:var(--hueso);border-radius:var(--radio);padding:.7rem .8rem}
.sellos-estado b{font-family:'JetBrains Mono',monospace;font-size:1.5rem;
  color:var(--concha);line-height:1;flex-shrink:0}
.sellos-estado.ok b{color:#7FBF7F}
.sellos-estado span{font-size:.71rem;line-height:1.4;color:var(--piedra)}
.sellos{list-style:none;display:flex;flex-direction:column;gap:.3rem;margin-top:.5rem}
.sello-item{width:100%;display:flex;align-items:flex-start;gap:.6rem;background:#fff;
  border:1px solid #E2DCCC;border-radius:var(--radio);padding:.55rem .65rem;cursor:pointer;
  font-family:inherit;text-align:left;transition:border-color .13s,background .13s}
.sello-item:hover{border-color:var(--musgo)}
.sello-item.hecho{background:#F1F6F1;border-color:#B8D4B8}
.sello-item:focus-visible{outline:2px solid var(--musgo);outline-offset:1px}
.sello-item .caja{width:20px;height:20px;border:2px solid #C4BCA6;border-radius:3px;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:.85rem;font-weight:700;line-height:1;margin-top:.05rem}
.sello-item.hecho .caja{background:var(--musgo);border-color:var(--musgo)}
.sello-item .txt{display:flex;flex-wrap:wrap;gap:.25rem .5rem;align-items:baseline}
.sello-item .txt b{font-size:.78rem;font-weight:500;width:100%;line-height:1.3}
.sello-item .km,.sello-item .hor{font-family:'JetBrains Mono',monospace;font-size:.62rem;color:#7C776B}
.sello-item .ofi{font-size:.58rem;letter-spacing:.05em;text-transform:uppercase;
  color:var(--musgo);font-weight:600}
.sellos-acciones{display:flex;gap:.4rem;margin-top:.7rem;flex-wrap:wrap}
.sellos-acciones button{flex:1;min-width:130px}
.nav-sellos{position:absolute;top:2px;right:3px;font-family:'JetBrains Mono',monospace;
  font-size:.5rem;background:var(--concha);color:var(--tinta);border-radius:6px;
  padding:0 .25rem;font-weight:700;line-height:1.5}

/* --- Equipaje (reutiliza .sellos / .sello-item para la lista) --- */
.eq-estado{display:flex;align-items:center;gap:.7rem;background:var(--tinta);
  color:var(--hueso);border-radius:var(--radio);padding:.7rem .8rem}
.eq-estado b{font-family:'JetBrains Mono',monospace;font-size:1.5rem;
  color:var(--concha);line-height:1;flex-shrink:0}
.eq-estado.ok b{color:#7FBF7F}
.eq-estado>span{font-size:.71rem;line-height:1.4;color:var(--piedra);flex:1}
.eq-barra{display:block;height:5px;margin-top:.4rem;background:rgba(237,232,220,.16);
  border-radius:3px;overflow:hidden}
.eq-barra i{display:block;height:100%;background:var(--concha);border-radius:3px;
  transition:width .2s}
.eq-estado.ok .eq-barra i{background:#7FBF7F}

/* --- Perfil interactivo --- */
.perfil svg{cursor:crosshair;touch-action:none}
.perfil .zona-toque{fill:transparent}

/* --- Compartir --- */
/* --- ¿Cuánto queda? --- */
#btnQueda{font-family:'JetBrains Mono',monospace;font-size:.63rem;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;background:none;
  border:1px solid rgba(216,163,60,.55);color:var(--concha);
  padding:.42rem .7rem;border-radius:var(--radio);cursor:pointer;white-space:nowrap;
  transition:border-color .15s,color .15s,background .15s}
#btnQueda:hover{border-color:var(--concha);background:rgba(216,163,60,.12);color:var(--hueso)}
#btnQueda:focus-visible{outline:2px solid var(--concha);outline-offset:2px}

.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;
  justify-content:center;padding:1rem}
.modal-fondo{position:absolute;inset:0;background:rgba(10,15,12,.72)}
.modal-caja{position:relative;background:var(--papel);color:var(--tinta);
  border-radius:var(--radio);width:min(430px,100%);max-height:88vh;overflow-y:auto;
  overscroll-behavior:contain;padding:1.15rem 1.15rem 1.3rem;
  box-shadow:0 14px 40px rgba(0,0,0,.45)}
.modal-x{position:absolute;top:.35rem;right:.5rem;background:none;border:none;
  font-size:1.5rem;line-height:1;color:#8B857A;cursor:pointer;padding:.2rem .35rem;
  border-radius:var(--radio)}
.modal-x:hover{color:var(--tinta)}
.modal-x:focus-visible{outline:2px solid var(--musgo);outline-offset:1px}

/* Recado del grupo (la ventana que sale al abrir la web) */
.recado-ico{font-size:2.6rem;line-height:1;text-align:center;margin:.2rem 0 .5rem}
.recado-t{font-size:1.25rem;line-height:1.35;text-align:center;margin:0 0 1rem;
  font-weight:700;color:var(--tinta)}
.recado-ok{display:block;width:100%;background:var(--concha);color:#1B2A23;border:none;
  padding:.7rem 1.4rem;border-radius:var(--radio);font:inherit;font-weight:600;cursor:pointer}
.recado-ok:focus-visible{outline:2px solid var(--musgo);outline-offset:2px}

.q-cab{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--musgo);font-weight:600}
.q-tit{font-family:'Fraunces',serif;font-weight:600;font-size:1.3rem;line-height:1.15;
  margin:.15rem 0 .1rem;padding-right:1.4rem}
.q-por{font-size:.7rem;color:#7C776B;line-height:1.35}
.q-reloj{background:var(--tinta);color:var(--hueso);border-radius:var(--radio);
  padding:.75rem .85rem;margin:.8rem 0 .1rem;text-align:center}
.q-reloj b{display:block;font-family:'JetBrains Mono',monospace;font-size:1.65rem;
  font-weight:600;color:var(--concha);line-height:1.1;letter-spacing:-.01em}
.q-reloj.pasado b{color:#7FBF7F;font-size:1.25rem}
.q-reloj span{display:block;font-size:.63rem;color:var(--piedra);margin-top:.3rem;
  line-height:1.4}
.q-datos{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.7rem}
.q-dato{background:#fff;border:1px solid #E2DCCC;border-radius:var(--radio);
  padding:.5rem .6rem}
.q-dato b{display:block;font-family:'JetBrains Mono',monospace;font-size:1.02rem;
  font-weight:600;line-height:1.15}
.q-dato span{display:block;font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;
  color:#7C776B;margin-top:.15rem}
.q-dato.ancho{grid-column:1 / -1}
.q-barra{height:6px;background:#E2DCCC;border-radius:3px;overflow:hidden;margin-top:.7rem}
.q-barra i{display:block;height:100%;background:var(--musgo);border-radius:3px}
.q-ojo{background:#FCF3F0;border-left:3px solid var(--alerta);border-radius:var(--radio);
  padding:.5rem .6rem;margin-top:.5rem;font-size:.72rem;line-height:1.4}
.q-acciones{display:flex;gap:.4rem;margin-top:.9rem;flex-wrap:wrap}
.q-acciones button{flex:1;min-width:135px}
@media(max-width:860px){
  .modal-caja{width:100%;max-height:90vh}
  .q-dato b{font-size:1.1rem}
}

#btnComp{background:none;border:1px solid rgba(237,232,220,.3);color:var(--piedra);
  font-family:'JetBrains Mono',monospace;font-size:.63rem;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;padding:.42rem .7rem;border-radius:var(--radio);cursor:pointer;
  white-space:nowrap;flex-shrink:0;transition:all .15s}
#btnComp:hover{border-color:var(--concha);color:var(--hueso)}
#btnComp:focus-visible{outline:2px solid var(--concha);outline-offset:2px}

/* --- Avisos --- */
#aviso{position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,1.5rem);
  background:var(--tinta);color:var(--hueso);padding:.7rem 1.1rem;border-radius:var(--radio);
  font-size:.76rem;line-height:1.4;max-width:min(92vw,420px);box-shadow:0 4px 18px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:60;text-align:center}
#aviso.visible{opacity:1;transform:translate(-50%,0)}

/* --- Estado sin conexión --- */
#sinRed{display:none;background:var(--alerta);color:#fff;font-family:'JetBrains Mono',monospace;
  font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;text-align:center;
  padding:.3rem;flex-shrink:0}
body.offline #sinRed{display:block}

/* --- Descarga para sin cobertura --- */
.descarga{background:var(--tinta);color:var(--hueso);border-radius:var(--radio);
  padding:.75rem .8rem;margin-top:.5rem}
.descarga .barra{height:5px;background:rgba(237,232,220,.18);border-radius:3px;
  margin:.55rem 0 .4rem;overflow:hidden}
.descarga .barra i{display:block;height:100%;background:var(--concha);width:0;
  transition:width .3s;border-radius:3px}
.descarga p{font-size:.68rem;line-height:1.45;color:var(--piedra)}
.descarga button{width:100%;margin-top:.5rem;background:var(--concha);color:var(--tinta);
  border:none;font-family:'JetBrains Mono',monospace;font-size:.63rem;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;padding:.5rem;border-radius:var(--radio);
  cursor:pointer}
.descarga button:disabled{opacity:.5;cursor:default}

/* Tipografía algo mayor en móvil: se lee al sol y con presbicia */
@media(max-width:860px){
  .hito .nom,.tel-n{font-size:.85rem}
  .bloque,.timing li{font-size:.83rem}
  .dl{font-size:.81rem}
  .nota{font-size:.76rem}
  .sello-item .txt b{font-size:.84rem}
}

@media(max-width:860px){
  main{grid-template-columns:1fr;grid-template-rows:1fr}
  /* Ficha y mapa comparten la MISMA celda. El mapa NO se oculta con
     display:none (eso lo crearía con tamaño 0 y el lienzo WebGL de iOS
     Safari se queda en negro aunque luego se llame a resize). En su lugar
     el mapa va detrás, SIEMPRE renderizado a tamaño completo, y el panel
     opaco lo tapa encima. Al ver el mapa, solo se oculta el panel y el mapa
     —que ya estaba dibujado a pantalla completa— aflora. */
  #col,#mapa{grid-column:1;grid-row:1}
  #mapa{z-index:0}
  #col{z-index:1;background:var(--papel)}
  main.mapa #col{display:none}
  /* La causa real del "mapa en una franja": la fila 1fr del grid se colapsa
     en iOS cuando la barra de geolocalización ocupa mucho, y el contenedor
     del mapa se queda casi sin alto. Al verlo, lo sacamos a PANTALLA COMPLETA
     de verdad (fixed, cubriendo todo), independiente del alto del grid. El
     botón "Ver ficha" queda por encima para volver. */
  main.mapa #mapa{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40}
  #verMapa{display:block;z-index:50}
  /* En vista mapa a pantalla completa, la barra de etapas flota ENCIMA del
     mapa (arriba, translúcida y con desenfoque) para poder saltar de etapa sin
     salir del mapa. No se toca el fixed del mapa: solo se superpone la nav.
     Se oculta/reaparece tocando el mapa (alterna .nav-oculta). La cabecera con
     el título queda tapada a propósito: lo importante es cambiar de etapa. */
  body.vista-mapa #nav{position:fixed;top:0;left:0;right:0;z-index:45;
    background:rgba(46,64,56,.82);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    box-shadow:0 2px 12px rgba(0,0,0,.38);transition:transform .22s ease}
  body.vista-mapa.nav-oculta #nav{transform:translateY(-100%)}
  /* Con la barra visible, se apartan hacia abajo los controles de MapLibre
     (zoom/brújula, arriba a la derecha) y los botones de capa (arriba a la
     izquierda) para que la barra no los tape. Al ocultarla, vuelven arriba. */
  body.vista-mapa:not(.nav-oculta) .maplibregl-ctrl-top-right{margin-top:var(--nav-h,52px)}
  body.vista-mapa:not(.nav-oculta) #capas{top:calc(var(--nav-h,52px) + 8px)}
  /* El FAB de ubicación sube para no solaparse con el botón "Ver ficha". */
  #miUbi{bottom:5rem}
  /* Que quepan todos los botones de la cabecera: si no caben en una línea,
     saltan a la siguiente en vez de cortarse. */
  header{flex-wrap:wrap;gap:.5rem;padding-left:.7rem;padding-right:.7rem}
  #btnHoy{margin:0}
  .marca b{font-size:.92rem}
  /* La cuenta atrás también se ve en móvil, pegada a la derecha de la
     cabecera (que envuelve si hace falta). */
  .cuenta{display:block;margin-left:auto;font-size:.6rem}
  .cuenta b{font-size:.76rem}
  .slider-datos{grid-template-columns:repeat(2,1fr);gap:.6rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const GRUPO = {total:12, desde:{fecha:'2026-08-20', momento:'tarde', total:11}};
/* Cuántos DUERMEN la noche de esa fecha (para plazas de alojamiento). */
function tamanoGrupo(f){ return f >= GRUPO.desde.fecha ? GRUPO.desde.total : GRUPO.total; }

/* Cuántos CAMINAN esa etapa. El grupo mengua por la tarde del 20 (Alejandro
   vuela tras llegar a Melide), así que ese día todavía caminan todos: la
   reducción de día empieza al día siguiente. Con 'mañana' empezaría el mismo
   día. Por eso las etapas 1-3 son de 12 y las 4-6 de 11, aunque la noche del
   20 ya duerman 11. */
function grupoCamina(f){
  const yaMenos = GRUPO.desde.momento === 'tarde'
    ? f > GRUPO.desde.fecha
    : f >= GRUPO.desde.fecha;
  return yaMenos ? GRUPO.desde.total : GRUPO.total;
}

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
'use strict';

/* ============================================================
   MOTOR DE MARCHA — Naismith con corrección Langmuir
   ============================================================ */
const Marcha = {
  distancia(a,b){
    const R=6371, rad=Math.PI/180;
    const dLat=(b.lat-a.lat)*rad, dLon=(b.lon-a.lon)*rad;
    const s=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));
  },
  tramo(dist, dh){
    const c = CONFIG_MARCHA;
    if(dist <= 0) return 0;
    const pend = Math.abs(dh)/(dist*1000);
    let h = dist/c.V_BASE;
    if(dh > 0) h += dh/c.ASCENSO_M_POR_HORA;
    else if(dh < 0){
      const baja = -dh;
      if(pend >= c.UMBRAL_BAJADA_FUERTE)     h += (baja/300)*c.PENAL_BAJADA_H_POR_300M;
      else if(pend >= c.UMBRAL_BAJADA_SUAVE) h -= (baja/300)*c.BONIF_BAJADA_H_POR_300M;
    }
    h *= c.FACTOR_FATIGA;
    h += (h*c.MIN_DESCANSO_POR_HORA)/60;
    return Math.max(h, dist/8);
  },
  /* Si hay traza GPX la usa; si no, cae a los puntos de la guía. */
  perfilTraza(n){
    const t = (typeof TRAZAS!=='undefined') ? TRAZAS[n] : null;
    if(!t) return null;
    const pts = t.linea.map(function(q){ return {lon:q[0], lat:q[1], ele:q[2], km:q[3]}; });
    return {puntos:pts, tramos:null, dPos:t.dPos, dNeg:t.dNeg, horas:null,
            maxEle:t.maxEle, minEle:t.minEle, km:t.km, esGpx:true, nOrig:t.nOrig};
  },
  perfil(puntos){
    const con = puntos.filter(p => typeof p.ele==='number' && typeof p.km==='number');
    if(con.length < 2) return null;
    let dPos=0, dNeg=0, horas=0, maxEle=-Infinity, minEle=Infinity;
    const tramos=[];
    for(let i=1;i<con.length;i++){
      const d  = con[i].km - con[i-1].km;
      const dh = con[i].ele - con[i-1].ele;
      if(dh>0) dPos+=dh; else dNeg+=-dh;
      const h = this.tramo(d, dh);
      horas += h;
      tramos.push({desde:con[i-1], hasta:con[i], km:d, dh, horas:h,
                   pendiente: d>0 ? (dh/(d*1000))*100 : 0});
    }
    con.forEach(p=>{ maxEle=Math.max(maxEle,p.ele); minEle=Math.min(minEle,p.ele); });
    return {puntos:con, tramos, dPos:Math.round(dPos), dNeg:Math.round(dNeg),
            horas, maxEle, minEle, km:con[con.length-1].km};
  },
  horarios(etapa){
    /* Mismos hitos saneados que la ficha y que "¿Cuánto queda?": si el
       horario se calculara con los puntos en crudo, la etapa 2 saldría con
       dos horas y media de más (ver hitosLimpios). */
    const base = (typeof hitosLimpios === 'function' && etapa.num)
      ? (hitosLimpios(etapa.num) || etapa.puntos) : etapa.puntos;
    const p = this.perfil(base);
    if(!p || !etapa.salida) return null;
    const [hh,mm] = etapa.salida.split(':').map(Number);
    let min = hh*60+mm;
    const res = [{punto:p.puntos[0], minutos:min}];
    p.tramos.forEach(t=>{ min += t.horas*60; res.push({punto:t.hasta, minutos:min}); });
    return res;
  },
  enKm(perfil, km){
    if(!perfil) return null;
    const p = perfil.puntos;
    if(km <= p[0].km) return {ele:p[0].ele, pendiente:0, nombre:p[0].nombre};
    const ult = p[p.length-1];
    if(km >= ult.km) return {ele:ult.ele, pendiente:0, nombre:ult.nombre};
    for(let i=1;i<p.length;i++){
      if(km <= p[i].km){
        const d = p[i].km - p[i-1].km;
        const f = d>0 ? (km-p[i-1].km)/d : 0;
        return {ele: p[i-1].ele + (p[i].ele-p[i-1].ele)*f,
                pendiente: d>0 ? ((p[i].ele-p[i-1].ele)/(d*1000))*100 : 0,
                nombre:p[i-1].nombre, siguiente:p[i].nombre};
      }
    }
    return null;
  },
  /* Coordenada a un km dado. Interpola sobre la TRAZA GPX real (`n` = número
     de etapa), no sobre los hitos de la guía: entre hito e hito hay kilómetros
     en línea recta que cortan campo a través. La traza lleva el km acumulado
     en la posición 3 de cada vértice: [lon, lat, altitud, km]. Está
     simplificada a 12 m, así que interpolar entre vértices sigue el sendero.
     Si una etapa no tuviera traza, se cae al método viejo con los hitos. */
  coordEnKm(puntos, km, n){
    const linea = (typeof TRAZAS !== 'undefined' && n && TRAZAS[n]) ? TRAZAS[n].linea : null;
    if(linea && linea.length){
      const pri = linea[0], ult = linea[linea.length-1];
      if(km <= pri[3]) return {lat:pri[1], lon:pri[0]};
      if(km >= ult[3]) return {lat:ult[1], lon:ult[0]};
      for(let i=1;i<linea.length;i++){
        if(km <= linea[i][3]){
          const a = linea[i-1], b = linea[i];
          const d = b[3] - a[3];
          const f = d > 0 ? (km - a[3]) / d : 0;
          return {lat: a[1] + (b[1]-a[1])*f, lon: a[0] + (b[0]-a[0])*f};
        }
      }
      return {lat:ult[1], lon:ult[0]};
    }
    /* --- Respaldo: hitos de la guía (recto entre uno y otro) --- */
    if(km <= puntos[0].km) return puntos[0];
    const ultH = puntos[puntos.length-1];
    if(km >= ultH.km) return ultH;
    for(let i=1;i<puntos.length;i++){
      if(km <= puntos[i].km){
        const d = puntos[i].km - puntos[i-1].km;
        const f = d>0 ? (km-puntos[i-1].km)/d : 0;
        return {lat: puntos[i-1].lat + (puntos[i].lat-puntos[i-1].lat)*f,
                lon: puntos[i-1].lon + (puntos[i].lon-puntos[i-1].lon)*f};
      }
    }
    return ultH;
  },
  formato(h){
    if(h==null || !isFinite(h)) return '—';
    const t = Math.round(h*60);
    return Math.floor(t/60) + ' h ' + String(t%60).padStart(2,'0') + ' min';
  },
  hora(min){
    const m = ((Math.round(min)%1440)+1440)%1440;
    return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
  }
};

/* ============================================================
   METEOROLOGÍA — Open-Meteo, API pública sin clave
   ============================================================ */
const Meteo = {
  cache: new Map(),

  /* DOS límites, y no son lo mismo.
     LIMITE_DIAS es hasta dónde SIRVE datos la API gratuita de Open-Meteo (16
     días). DIAS_FIABLES es hasta dónde la previsión merece confianza.
     Antes había uno solo, en 9, y todo lo de más allá se escondía con un
     «mostrar un dato ahora sería inventarlo». Pero enseñar lo que responde
     Open-Meteo NO es inventarlo: inventarlo sería enseñarlo como si fuera
     firme. Así que a partir de DIAS_FIABLES se enseña MARCADO como
     orientativo, que es la diferencia entre callar un dato y contarlo con su
     grado de confianza. */
  LIMITE_DIAS: 16,
  DIAS_FIABLES: 9,

  diasHasta(fechaISO){
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    const [a,m,d] = fechaISO.split('-').map(Number);
    return Math.round((new Date(a,m-1,d) - hoy)/86400000);
  },
  disponible(fechaISO){
    const d = this.diasHasta(fechaISO);
    return d >= 0 && d <= this.LIMITE_DIAS;
  },
  /* ¿Es de fiar, o solo orientativa? */
  fiable(fechaISO){
    const d = this.diasHasta(fechaISO);
    return d >= 0 && d <= this.DIAS_FIABLES;
  },
  async pedir(lat, lon, fecha){
    const clave = lat.toFixed(3)+','+lon.toFixed(3)+','+fecha;
    if(this.cache.has(clave)) return this.cache.get(clave);
    const url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat.toFixed(4)
      + '&longitude='+lon.toFixed(4)
      + '&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,apparent_temperature'
      + '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset'
      + '&timezone=Europe%2FMadrid&start_date='+fecha+'&end_date='+fecha;
    const r = await fetch(url);
    if(!r.ok) throw new Error('Open-Meteo respondió '+r.status);
    const j = await r.json();
    this.cache.set(clave, j);
    return j;
  },
  describir(c){
    const t = {
      0:['Despejado','\u2600'], 1:['Casi despejado','\uD83C\uDF24'], 2:['Nubes y claros','\u26C5'],
      3:['Nublado','\u2601'], 45:['Niebla','\uD83C\uDF2B'], 48:['Niebla helada','\uD83C\uDF2B'],
      51:['Llovizna débil','\uD83C\uDF26'], 53:['Llovizna','\uD83C\uDF26'], 55:['Llovizna intensa','\uD83C\uDF26'],
      61:['Lluvia débil','\uD83C\uDF27'], 63:['Lluvia','\uD83C\uDF27'], 65:['Lluvia fuerte','\uD83C\uDF27'],
      66:['Lluvia helada','\uD83C\uDF27'], 67:['Lluvia helada fuerte','\uD83C\uDF27'],
      71:['Nieve débil','\uD83C\uDF28'], 73:['Nieve','\uD83C\uDF28'], 75:['Nieve intensa','\uD83C\uDF28'],
      80:['Chubascos','\uD83C\uDF26'], 81:['Chubascos','\uD83C\uDF26'], 82:['Chubascos fuertes','\u26C8'],
      95:['Tormenta','\u26C8'], 96:['Tormenta con granizo','\u26C8'], 99:['Tormenta fuerte','\u26C8']
    };
    return t[c] || ['Sin datos','\u00B7'];
  }
};

/* ============================================================
   MAPA
   ============================================================ */
/* Ortofoto oficial del IGN (PNOA). Mejor resolución que ESRI en la Galicia
   rural y actualizada. Servicio WMTS en EPSG:3857 (GoogleMapsCompatible), que
   es lo que espera MapLibre; la URL es la forma KVP de GetTile porque el
   servicio no publica plantilla REST. Cubre SOLO España: fuera de aquí no
   habría imagen, pero todo el viaje es español. */
const URL_PNOA = 'https://www.ign.es/wmts/pnoa-ma?service=WMTS&request=GetTile'
  + '&version=1.0.0&layer=OI.OrthoimageCoverage&style=default'
  + '&tilematrixset=GoogleMapsCompatible&format=image/jpeg'
  + '&TileMatrix={z}&TileRow={y}&TileCol={x}';

/* Respaldo por si el IGN falla: la capa que había antes. */
const URL_ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';

const ESTILO = {
  version:8,
  sources:{
    sat:{type:'raster', tiles:[URL_PNOA], tileSize:256, maxzoom:19,
      attribution:'PNOA cedido por © Instituto Geográfico Nacional de España'},
    relieve:{type:'raster-dem',
      tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      encoding:'terrarium', tileSize:256, maxzoom:15}
  },
  /* El satélite es la única capa de fondo, y va la primera para que la traza
     y los marcadores queden siempre por encima. */
  layers:[{id:'sat', type:'raster', source:'sat'}],
  terrain:{source:'relieve', exaggeration:1.6}
};

/* Vista 3D, recordada entre visitas. (Hubo una capa topográfica alternativa;
   se retiró: con el PNOA a esta resolución no aportaba lo bastante como para
   duplicar la descarga del modo sin cobertura.) */
const Capa = {
  CLAVE3D:'lolitas2026-3d',
  es3D: function(){
    try{ return localStorage.getItem(this.CLAVE3D) === '1'; }catch(e){ return false; }
  },
  alternar3D: function(){
    const nuevo = !this.es3D();
    try{ localStorage.setItem(this.CLAVE3D, nuevo ? '1' : '0'); }catch(e){}
    aplicar3D(true);
    pintarControlesMapa();
  }
};

/* Vista plana (pitch 0) o en perspectiva (pitch 60). */
function aplicar3D(animar){
  if(!mapa || !mapaListo) return;
  const pitch = Capa.es3D() ? 60 : 0;
  try{
    if(animar) mapa.easeTo({pitch:pitch, duration:1000});
    else mapa.setPitch(pitch);
  }catch(e){}
}

/* Botones sobre el mapa, arriba a la izquierda. */
function pintarControlesMapa(){
  const c = document.getElementById('capas');
  if(!c) return;
  const tres = Capa.es3D();
  /* "Satélite" queda como indicador de qué se está viendo (ya no hay otra capa
     entre la que alternar); el único botón que actúa es el de 3D. */
  c.innerHTML =
      '<span class="on">Satélite</span>'
    + '<button class="' + (tres ? 'on' : '') + '" onclick="Capa.alternar3D()">3D</button>';
}

let mapa=null, marcadores=[], marcadorPos=null, mapaListo=false;

/* Etiqueta de build, visible en el diagnóstico (?debug). Sirve para saber, sin
   Mac ni consola, qué versión ha cargado de verdad el móvil (por si la caché
   sigue sirviendo una vieja). Súbela cuando cambies algo del mapa. */
const APP_VERSION = 'map-10';

function iniciarMapa(){
  if(typeof maplibregl === 'undefined'){
    document.getElementById('mapa').innerHTML =
      '<div style="padding:2rem;color:#B5AE9E;font-size:.8rem;line-height:1.6">'
      + 'No se ha podido cargar la librería del mapa. Comprueba la conexión y recarga la página.</div>';
    return;
  }
  mapa = new maplibregl.Map({container:'mapa', style:ESTILO, center:[-7.98,42.86],
    zoom:8.4, attributionControl:false, maxPitch:72});
  mapa.addControl(new maplibregl.NavigationControl({visualizePitch:true}), 'top-right');
  mapa.addControl(new maplibregl.ScaleControl({unit:'metric'}), 'bottom-right');
  /* En vista mapa a pantalla completa (móvil), tocar el mapa alterna la barra
     de etapas flotante: se oculta para ganar mapa y reaparece al tocar otra
     vez. El evento 'click' de MapLibre solo salta en un toque limpio, no al
     arrastrar o hacer zoom, así que no estorba a la navegación del mapa. */
  mapa.on('click', function(){
    if(document.body.classList.contains('vista-mapa')){
      document.body.classList.toggle('nav-oculta');
    }
  });

  mapa.on('load', function(){
    mapaListo = true;
    try{ mapa.setTerrain({source:'relieve', exaggeration:1.6}); }catch(e){}
    aplicar3D(false);
    pintarControlesMapa();
    dibujar(vistaEtapa);
    try{ mapa.resize(); }catch(e){}
  });

  /* Respaldo: el PNOA solo cubre España y es un servicio público. Si empieza a
     fallar (servicio caído, bloqueo), se cambia UNA vez a la capa de ESRI que
     había antes, para no quedarse sin fondo en mitad del Camino. */
  let fallosSat = 0, yaEnRespaldo = false;
  mapa.on('error', function(e){
    const msg = e && e.error && e.error.message;
    if(e && e.sourceId === 'sat' && !yaEnRespaldo){
      fallosSat++;
      if(fallosSat >= 8){
        yaEnRespaldo = true;
        try{
          mapa.getSource('sat').setTiles([URL_ESRI]);
          const a = document.getElementById('attr');
          if(a) a.innerHTML = 'Imágenes: ESRI World Imagery (el IGN no responde)'
            + '<br>Relieve: AWS Terrain · Datos meteo: Open-Meteo.com';
          console.warn('PNOA no responde: se cambia a ESRI de respaldo.');
        }catch(err){ /* si setTiles no existe, se queda como está */ }
      }
    }
    console.warn('Mapa:', msg);
  });
  /* iOS Safari suele crear el mapa antes de que el contenedor tenga su tamaño
     final, y entonces el lienzo se queda en una franja. Un ResizeObserver
     reajusta el lienzo CADA vez que el contenedor cambia de tamaño —al alternar
     ficha/mapa, al girar, o cuando el layout se asienta—, sea cual sea el
     momento. Es lo único que se adapta a todos los casos sin depender de
     temporizadores. */
  try{
    if(typeof ResizeObserver !== 'undefined'){
      const ro = new ResizeObserver(function(){ try{ mapa.resize(); }catch(e){} });
      ro.observe(document.getElementById('mapa'));
    }
  }catch(e){}
}

function limpiarMarcadores(){
  marcadores.forEach(function(m){ try{ m.remove(); }catch(e){} });
  marcadores = [];
  if(marcadorPos){ try{ marcadorPos.remove(); }catch(e){} marcadorPos = null; }
}

function marcador(lat, lon, html, clases){
  const el = document.createElement('div');
  el.className = 'mk ' + clases;
  el.innerHTML = html;
  const m = new maplibregl.Marker({element:el, anchor:'center'})
    .setLngLat([lon,lat]).addTo(mapa);
  marcadores.push(m);
  return el;
}

function dibujarIndice(){
  limpiarMarcadores();
  quitarCapas();
  const b = new maplibregl.LngLatBounds();
  if(typeof TRAZAS!=='undefined'){
    for(let i=1;i<=6;i++){
      if(!TRAZAS[i]) continue;
      const coords = TRAZAS[i].linea.map(function(q){ return [q[0],q[1]]; });
      mapa.addSource('idx-'+i, {type:'geojson',
        data:{type:'Feature', geometry:{type:'LineString', coordinates:coords}}});
      mapa.addLayer({id:'idx-linea-'+i, type:'line', source:'idx-'+i,
        layout:{'line-join':'round','line-cap':'round'},
        paint:{'line-color':COLORES_ETAPA[i-1],'line-width':3,'line-opacity':.92}});
      coords.forEach(function(c){ b.extend(c); });
    }
  }
  ETAPAS.forEach(function(et,i){
    const p = et.puntos[0];
    const el = marcador(p.lat, p.lon,
      '<span>'+et.num+'</span><span class="mk-lbl">'+esc(et.origen)+'</span>', 'mk-et');
    el.style.background = COLORES_ETAPA[i];
    el.title = 'Etapa '+et.num+': '+et.origen+' → '+et.destino;
    el.onclick = function(){ irA(et.num); };
    b.extend([p.lon, p.lat]);
  });
  const f = ETAPAS[5].puntos[ETAPAS[5].puntos.length-1];
  const el = marcador(f.lat, f.lon, '<span>\u2605</span><span class="mk-lbl">Santiago</span>', 'mk-et');
  el.style.background = COLORES_ETAPA[5];
  el.title = 'Llegada';
  b.extend([f.lon, f.lat]);
  mapa.fitBounds(b,{padding:70, maxZoom:9.6, duration:600});
  setTimeout(function(){ try{ mapa.fitBounds(b,{padding:70,maxZoom:9.6,duration:400}); }catch(e){} }, 350);
}

function quitarCapas(){
  if(mapa.getLayer('desvios-linea')) mapa.removeLayer('desvios-linea');
  if(mapa.getSource('desvios')) mapa.removeSource('desvios');
  ['traza-linea','traza-borde'].forEach(function(id){
    if(mapa.getLayer(id)) mapa.removeLayer(id);
  });
  if(mapa.getSource('traza')) mapa.removeSource('traza');
  for(let i=1;i<=6;i++){
    ['idx-linea-'+i].forEach(function(id){ if(mapa.getLayer(id)) mapa.removeLayer(id); });
    if(mapa.getSource('idx-'+i)) mapa.removeSource('idx-'+i);
  }
}

function dibujarTraza(n, color){
  if(typeof TRAZAS==='undefined' || !TRAZAS[n]) return;
  const coords = TRAZAS[n].linea.map(function(q){ return [q[0], q[1]]; });
  mapa.addSource('traza', {type:'geojson',
    data:{type:'Feature', geometry:{type:'LineString', coordinates:coords}}});
  mapa.addLayer({id:'traza-borde', type:'line', source:'traza',
    layout:{'line-join':'round','line-cap':'round'},
    paint:{'line-color':'#FFFFFF','line-width':6,'line-opacity':.75}});
  mapa.addLayer({id:'traza-linea', type:'line', source:'traza',
    layout:{'line-join':'round','line-cap':'round'},
    paint:{'line-color':color,'line-width':3.2}});
}

function dibujarEtapa(n){
  limpiarMarcadores();
  quitarCapas();
  const et = ETAPAS[n-1], color = COLORES_ETAPA[n-1];
  dibujarTraza(n, color);
  const b = new maplibregl.LngLatBounds();
  et.puntos.forEach(function(p){
    const extremo = p.tipo==='inicio' || p.tipo==='fin';
    const menor = p.tipo==='paso' && !extremo;
    const el = marcador(p.lat, p.lon,
      menor ? '' : '<span class="mk-lbl">'+esc(p.nombre)+'</span>',
      'mk-pt' + (extremo ? ' grande' : ''));
    el.style.background = extremo ? color : (p.fiable ? '#fff' : '#B5AE9E');
    if(!extremo && !p.fiable) el.style.borderStyle = 'dashed';
    if(p.fueraDeRuta){ el.classList.add('mk-fuera'); }
    if(menor){ el.style.width='10px'; el.style.height='10px'; el.style.opacity='.75'; }
    el.title = p.nombre + ' · km ' + p.km + (p.fiable ? '' : ' — ubicación aproximada');
    el.onclick = function(){ abrirHito(p.nombre); };
    b.extend([p.lon, p.lat]);
  });
  dibujarDesvios(n, et, color);
  mapa.fitBounds(b,{padding:80, maxZoom:13.2, duration:600});
  setTimeout(function(){ try{ mapa.fitBounds(b,{padding:80,maxZoom:13.2,duration:400}); }catch(e){} }, 350);
}

/* Los puntos marcados `fueraDeRuta` no están sobre el Camino (tienen desvío
   señalizado). Se unen con una línea fina discontinua al vértice más cercano
   de la traza: así se ve de un vistazo que hay que salirse, y cuánto. Se elige
   la línea en vez del borde discontinuo porque ese ya significa otra cosa
   ("ubicación aproximada") y se confundirían. */
function dibujarDesvios(n, et, color){
  const linea = (typeof TRAZAS !== 'undefined' && TRAZAS[n]) ? TRAZAS[n].linea : null;
  if(!linea) return;
  const feats = [];
  et.puntos.forEach(function(p){
    if(!p.fueraDeRuta) return;
    let mejor = null;
    for(let i=0;i<linea.length;i++){
      const q = linea[i];
      const d = Marcha.distancia({lat:p.lat, lon:p.lon}, {lat:q[1], lon:q[0]});
      if(!mejor || d < mejor.d) mejor = {d:d, lon:q[0], lat:q[1]};
    }
    if(mejor) feats.push({type:'Feature', geometry:{type:'LineString',
      coordinates:[[p.lon, p.lat], [mejor.lon, mejor.lat]]}});
  });
  if(!feats.length) return;
  try{
    mapa.addSource('desvios', {type:'geojson',
      data:{type:'FeatureCollection', features:feats}});
    mapa.addLayer({id:'desvios-linea', type:'line', source:'desvios',
      paint:{'line-color':color, 'line-width':1.6, 'line-dasharray':[2,2],
             'line-opacity':.9}});
  }catch(e){}
}

function dibujar(v){
  if(!mapa || !mapaListo) return;
  /* Solo las etapas 1-6 tienen traza propia; portada (-1), índice (0),
     retos (7) y equipaje (8) muestran el conjunto. */
  try{ (v >= 1 && v <= 6) ? dibujarEtapa(v) : dibujarIndice(); }
  catch(e){ console.warn('No se ha podido dibujar el mapa:', e.message); }
}

function moverPosicion(lat, lon){
  if(!mapa || !mapaListo) return;
  if(!marcadorPos){
    const el = document.createElement('div');
    el.className = 'mk mk-pos';
    marcadorPos = new maplibregl.Marker({element:el, anchor:'center'})
      .setLngLat([lon,lat]).addTo(mapa);
  } else {
    marcadorPos.setLngLat([lon,lat]);
  }
}

/* ============================================================

   ============================================================ */
const ICONO = {inicio:'Salida', fin:'Llegada', iglesia:'Iglesia', comida:'Comer',
  taxi:'Punto de escape', cultura:'Patrimonio', mirador:'Mirador',
  fuente:'Fuente', albergue:'Dormir', paso:'De paso'};

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
/* CSS.escape no existe en navegadores antiguos */
function escSel(s){
  return (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g,'\\$&');
}
function fechaLarga(iso){
  const p = iso.split('-').map(Number);
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
                 'septiembre','octubre','noviembre','diciembre'];
  return p[2] + ' de ' + meses[p[1]-1] + ' de ' + p[0];
}
function isoHoy(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ============================================================
   GRÁFICO DE PERFIL — SVG generado a mano, sin librerías
   ============================================================ */
function svgPerfil(perfil, color, kmActual){
  if(!perfil) return '<div class="nota">Sin altitudes para esta etapa.</div>';
  const W=340, H=112, mI=32, mD=8, mS=10, mB=20;
  const gW = W-mI-mD, gH = H-mS-mB;
  const kmMax = perfil.km;
  const eMin = Math.floor((perfil.minEle-30)/50)*50;
  const eMax = Math.ceil((perfil.maxEle+30)/50)*50;
  const x = function(km){ return mI + (km/kmMax)*gW; };
  const y = function(e){ return mS + gH - ((e-eMin)/(eMax-eMin))*gH; };

  const pts = perfil.puntos.map(function(p){
    return x(p.km).toFixed(1)+','+y(p.ele).toFixed(1); }).join(' ');
  const area = mI+','+(mS+gH)+' '+pts+' '+x(kmMax).toFixed(1)+','+(mS+gH);

  let rejilla='';
  for(let e=eMin; e<=eMax; e+=100){
    const yy = y(e).toFixed(1);
    rejilla += '<line x1="'+mI+'" y1="'+yy+'" x2="'+(W-mD)+'" y2="'+yy
             + '" stroke="#EDE7D8" stroke-width="1"/>'
             + '<text class="cota" x="'+(mI-4)+'" y="'+(Number(yy)+3).toFixed(1)
             + '" text-anchor="end">'+e+'</text>';
  }

  /* Los círculos marcan los hitos con nombre, no cada vértice de la traza */
  const marcables = perfil.hitos ? perfil.hitos.filter(function(p){ return p.tipo!=='paso'; })
                                 : perfil.puntos.filter(function(p){ return p.tipo!=='paso'; });
  const hitos = marcables.map(function(p){
      return '<circle cx="'+x(p.km).toFixed(1)+'" cy="'+y(p.ele).toFixed(1)
        + '" r="2.6" fill="#fff" stroke="'+color+'" stroke-width="1.6"><title>'
        + esc(p.nombre)+' \u00B7 km '+p.km+' \u00B7 '+Math.round(p.ele)+' m</title></circle>';
    }).join('');

  let marca='';
  if(typeof kmActual === 'number'){
    const info = Marcha.enKm(perfil, kmActual);
    if(info){
      const xx = x(kmActual).toFixed(1), yy = y(info.ele).toFixed(1);
      marca = '<line x1="'+xx+'" y1="'+mS+'" x2="'+xx+'" y2="'+(mS+gH)
            + '" stroke="#D8A33C" stroke-width="1.5" stroke-dasharray="3 2"/>'
            + '<circle cx="'+xx+'" cy="'+yy+'" r="4.5" fill="#D8A33C" stroke="#fff" stroke-width="2"/>';
    }
  }

  /* Rectángulo transparente que captura toques y clics: al pulsar
     el gráfico el marcador salta a ese kilómetro. */
  const zona = '<rect class="zona-toque" x="'+mI+'" y="'+mS+'" width="'+gW+'" height="'+gH
    + '" onclick="tocarPerfil(event,'+kmMax+','+mI+','+gW+')"'
    + ' onpointermove="arrastrarPerfil(event,'+kmMax+','+mI+','+gW+')"/>';

  return '<div class="perfil"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Perfil: sube '
    + perfil.dPos+' metros y baja '+perfil.dNeg+' metros. Pulsa para moverte por la etapa.">'
    + rejilla
    + '<polygon points="'+area+'" fill="'+color+'" opacity=".16"/>'
    + '<polyline points="'+pts+'" fill="none" stroke="'+color
    + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>'
    + hitos + marca + zona
    + '<text class="lbl" x="'+mI+'" y="'+(H-5)+'">0 km</text>'
    + '<text class="lbl" x="'+(W-mD)+'" y="'+(H-5)+'" text-anchor="end">'+kmMax+' km</text>'
    + '</svg><div class="perfil-pie"><span>Mínimo '+perfil.minEle
    + ' m</span><span>Máximo '+perfil.maxEle+' m</span></div></div>';
}

let kmSlider = 0;

function pintarSubnav(){
  const sn = document.getElementById('subnav');
  /* Portada, índice, retos y equipaje no tienen sub-pestañas */
  if(vistaEtapa <= 0 || vistaEtapa >= 7){ sn.style.display='none'; sn.innerHTML=''; return; }
  sn.style.display='flex';
  const color = COLORES_ETAPA[vistaEtapa-1];
  const cs = (typeof Sellos!=='undefined' && vistaEtapa>=1)
    ? Sellos.cuenta(vistaEtapa) : {hechos:0,total:0};

      + ';position:relative" onclick="irASeccion(\''+s.id+'\')">'+s.nom+badge+'</button>';

/* ============================================================
   PANEL — PORTADA
   La primera pantalla para quien no sabe qué es esto (la abuela
   Lola, quien llega por un enlace). Con ?etapa=N no se ve: se
   entra directo a la etapa. Dibuja el trazado como SVG propio a
   partir de TRAZAS, sin imágenes externas.
   ============================================================ */
function svgPortadaMapa(){
  if(typeof TRAZAS==='undefined') return '';
  const lineas = [];
  let minLon=Infinity, maxLon=-Infinity, minLat=Infinity, maxLat=-Infinity;
  for(let n=1;n<=6;n++){
    if(!TRAZAS[n]) continue;
    const pts = TRAZAS[n].linea;
    lineas.push({n:n, pts:pts});
    pts.forEach(function(q){
      if(q[0]<minLon)minLon=q[0]; if(q[0]>maxLon)maxLon=q[0];
      if(q[1]<minLat)minLat=q[1]; if(q[1]>maxLat)maxLat=q[1];
    });
  }
  if(!lineas.length || !isFinite(minLon)) return '';
  const lat0 = (minLat+maxLat)/2, kx = Math.cos(lat0*Math.PI/180);
  const W = 1000, P = 52;
  const spanX = (maxLon-minLon)*kx || 1, spanY = (maxLat-minLat) || 1;
  const scale = (W-2*P)/spanX;
  const H = Math.round(spanY*scale + 2*P);
  function X(lon){ return (P+(lon-minLon)*kx*scale).toFixed(1); }
  function Y(lat){ return (P+(maxLat-lat)*scale).toFixed(1); }

  let trazos = '';
  lineas.forEach(function(L){
    const pts = L.pts.map(function(q){ return X(q[0])+','+Y(q[1]); }).join(' ');
    trazos += '<polyline points="'+pts+'" fill="none" stroke="'+COLORES_ETAPA[L.n-1]
      + '" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>';
  });
  const ini = lineas[0].pts[0];
  const ultima = lineas[lineas.length-1].pts;
  const fin = ultima[ultima.length-1];
  const hitos =
      '<circle cx="'+X(ini[0])+'" cy="'+Y(ini[1])+'" r="10" fill="#EDE8DC" stroke="#1B2A23" stroke-width="3"/>'
    + '<circle cx="'+X(fin[0])+'" cy="'+Y(fin[1])+'" r="13" fill="#D8A33C" stroke="#1B2A23" stroke-width="3"/>'
    + '<text x="'+(X(ini[0])-16)+'" y="'+(Y(ini[1])+9)+'" text-anchor="end" '
      + 'font-family="Fraunces,serif" font-size="30" font-weight="600" fill="#EDE8DC">Sarria</text>'
    + '<text x="'+(Number(X(fin[0]))+20)+'" y="'+(Y(fin[1])+9)+'" text-anchor="start" '
      + 'font-family="Fraunces,serif" font-size="30" font-weight="600" fill="#D8A33C">Santiago</text>';

  return '<svg class="portada-mapa" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" '
    + 'role="img" aria-label="Trazado de las seis etapas, de Sarria a Santiago">'
    + '<rect width="'+W+'" height="'+H+'" rx="4" fill="#1B2A23"/>'
    + trazos + hitos + '</svg>';
}

/* Apartado de decisiones pendientes del grupo. El estado sale de
   la constante DECISIONES (datos.js): es lo único compartido, y lo
   actualiza a mano quien mantiene la web. Cada tarjeta abre WhatsApp
   con el mensaje preparado (wa.me sin número: deja elegir el chat).
   Deliberadamente NO hay votación ni localStorage: sin servidor,
   marcar algo aquí solo lo vería quien lo marca, y eso engaña. */
const ETIQUETA_DECISION = {pendiente:'Pendiente', encurso:'En curso', resuelto:'Resuelto'};

function decisionesIndice(){
  if(typeof DECISIONES === 'undefined' || !DECISIONES.length) return '';
  const tarjetas = DECISIONES.map(function(d){
    /* Un estado desconocido cae a 'pendiente': antes enseñarlo abierto de
       más que darlo por cerrado sin serlo. */
    const est = ETIQUETA_DECISION[d.estado] ? d.estado : 'pendiente';
    const resuelto = est === 'resuelto';
    const r = d.respuesta;
    const wa = 'https://wa.me/?text=' + encodeURIComponent(d.wa);
    return '<div class="decision '+est+'">'
      + '<h3>'+esc(d.titulo)
      + '<span class="estado '+est+'">'+ETIQUETA_DECISION[est]+'</span></h3>'
      + '<p>'+esc(d.que)+'</p>'
      + '<p class="cuando">'+esc(d.cuando)+'</p>'
      + (r ? '<div class="resp"><q>'+esc(r.texto)+'</q>'
             + '<span class="quien">'+esc(r.quien)+' · '+esc(r.cuando)+'</span>'
             + (r.aclara ? '<p class="aclara">'+esc(r.aclara)+'</p>' : '')
             + '</div>' : '')
      + (resuelto ? '' :
         '<a class="wa" href="'+wa+'" target="_blank" rel="noopener">'
         + (est === 'encurso' ? 'Preguntar cómo va por WhatsApp'
                              : 'Preguntar al grupo por WhatsApp')+'</a>')
      + '</div>';
  }).join('');
  const abiertas = DECISIONES.filter(function(d){ return d.estado !== 'resuelto'; }).length;
  return '<h2>Decisiones del grupo</h2>'
    + '<div class="nota">Estas '+DECISIONES.length+' cosas dependen de decisiones del grupo, '
    + 'no del código. '
    + (abiertas === 0 ? 'Ya están todas cerradas. '
       : abiertas === 1 ? 'Queda una sin cerrar. '
       : 'Quedan '+abiertas+' sin cerrar. ')
    + 'El estado que se ve aquí lo actualiza quien mantiene la web cuando algo se '
    + 'cierra de verdad; no se guarda en cada móvil, así que todos veis lo mismo. Las que siguen '
    + 'abiertas llevan un botón para preguntarlas por WhatsApp, y donde el grupo ya ha contestado '
    + 'se recoge la respuesta.</div>'
    + '<div class="decisiones">'+tarjetas+'</div>';
}

function seccionRuta(et, color){
  const horarios = Marcha.horarios(et);
  const hMap = {};
  if(horarios) horarios.forEach(function(h){ hMap[h.punto.nombre] = h.minutos; });
  const u = Geo.ultima;
  const enRuta = u && u.etapa === et.num;

  const lista = et.puntos.map(function(p){
    const min = hMap[p.nombre];
    return '<li><button class="hito" style="--c:'+color+'" data-nombre="'+esc(p.nombre)
      + '" data-km="'+p.km+'" onclick="alternarHito(this,'+p.lat+','+p.lon+','+p.km+')" '
      + 'aria-expanded="false">'
      + '<span class="nom">'+esc(p.nombre)+(p.sellar?'<span class="sello">Sellar</span>':'')+'</span>'
      + '<span class="km">km '+p.km+(p.kmGuia!=null&&Math.abs(p.kmGuia-p.km)>=0.3
          ? '<br><span style="opacity:.6;font-size:.9em">guía '+p.kmGuia+'</span>' : '')+'</span>'
      + '<span class="tag">'+(ICONO[p.tipo]||p.tipo)
      + (p.horario?' \u00B7 '+esc(p.horario):'')
      + (p.ajustado?' \u00B7 situado sobre la traza':'')+'</span>'
      + (enRuta ? (function(){
            const dd = p.km - u.km;
            if(dd < -0.1) return '<span class="llegada" style="opacity:.55">ya has pasado</span>';
            const hh = Marcha.tramo(dd, (p.ele||u.ele) - u.ele);
            return '<span class="llegada"><b>a '+dd.toFixed(1)+' km</b> desde donde estás \u00B7 '
                 + Marcha.formato(hh)+'</span>';
          })()
        : (min!=null?'<span class="llegada">Paso estimado: '+Marcha.hora(min)
           + (p.ele!=null?' \u00B7 '+Math.round(p.ele)+' m':'')+'</span>':''))
      + (p.fueraDeRuta
          ? '<span class="ficha"><b>Fuera del Camino:</b> hay que desviarse unos '
            + Math.round(p.desvio_m||0) + ' m desde la ruta (ida, y otro tanto de vuelta).'
            + (p.ficha ? ' ' + esc(p.ficha) : '') + '</span>'
          : (p.ficha?'<span class="ficha">'+esc(p.ficha)+'</span>':''))
      + '</button></li>';
  }).join('');

  return '<h2>Puntos del recorrido</h2><ul class="hitos">'+lista+'</ul>'
    + '<div class="nota">Los kilómetros son los de la traza GPX. Cuando difieren de los de la '
    + 'tita Lucila '
    + 'en más de 300 m se muestran ambos. Las horas salen del modelo de marcha partiendo de una '
    + 'salida a las '+esc(et.salida||'—')+', sin contar paradas: el horario de la tita Lucila '
    + 'está en «Itinerario».</div>';
}
