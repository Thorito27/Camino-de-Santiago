    + '<div class="metrica sube"><b>+'+perfil.dPos+'</b><span>metros de subida</span></div>'
    + '<div class="metrica baja"><b>\u2212'+perfil.dNeg+'</b><span>metros de bajada</span></div>'
    + '<div class="metrica"><b>'+perfil.maxEle+'</b><span>cota máxima</span></div>'
    + '<div class="metrica"><b>'+perfil.minEle+'</b><span>cota mínima</span></div></div>';

  if(duros.length){
    html += '<h2>Las subidas que se notan</h2><div class="bloque"><ul>'
      + duros.map(function(t){
        return '<li><b>'+esc(t.desde.nombre)+' \u2192 '+esc(t.hasta.nombre)+'</b> \u00B7 +'
          + Math.round(t.dh)+' m en '+t.km.toFixed(1)+' km \u00B7 '
          + t.pendiente.toFixed(1)+' % de media</li>';
      }).join('') + '</ul></div>';
  }
  if(bajadas.length){
    html += '<h2>Las bajadas fuertes</h2><div class="bloque"><ul>'
      + bajadas.map(function(t){
        return '<li><b>'+esc(t.desde.nombre)+' \u2192 '+esc(t.hasta.nombre)+'</b> \u00B7 '
          + Math.round(t.dh)+' m en '+t.km.toFixed(1)+' km \u00B7 '+t.pendiente.toFixed(1)+' %'
          + (t.pendiente < -12 ? ' \u2014 castiga las rodillas' : '')+'</li>';
      }).join('') + '</ul></div>';
  }

  if(esGpx){
    html += '<div class="nota">Perfil trazado sobre '+perfil.nOrig.toLocaleString('es-ES')
      + ' puntos GPS de una traza de Wikiloc. La altitud está suavizada con media móvil de 31 '
      + 'puntos y el desnivel se cuenta con umbral de 10 m, para descartar el ruido del GPS: sin '
      + 'ese filtro el D+ saldría más del triple de lo real. Calibrado contra las cifras que '
      + 'publica Gronze.</div>';
  } else {
    if(et.perfilNota) html += '<div class="nota roja">'+esc(et.perfilNota)+'</div>';
    html += '<div class="nota">El perfil une las cotas de la tita Lucila pueblo a pueblo, en línea '
      + 'recta, así que el sube-y-baja intermedio no aparece.</div>';
  }
  return html;
}

function seccionTiempo(et){
  const dias = Meteo.diasHasta(et.fecha);
  let estado;
  if(Meteo.disponible(et.fecha)){
    estado = '<div class="meteo-estado"><span class="cargando"></span>Consultando Open-Meteo\u2026</div>';
  } else if(dias < 0){
    estado = '<div class="meteo-estado"><b>Etapa pasada.</b><br>Open-Meteo solo da previsión '
      + 'hacia adelante.</div>';
  } else {
    estado = '<div class="meteo-estado"><b>Previsión aún no disponible.</b><br>Faltan '+dias
      + ' días para esta etapa y Open-Meteo llega a '+Meteo.LIMITE_DIAS
      + '. Mostrar un dato ahora sería inventarlo.</div>';
  }
  return '<h2>Previsión de la etapa</h2><div id="meteoEtapa">'+estado+'</div>'
    + avisoOrientativa(et)
    + '<div class="nota">Agosto en Galicia interior: mañanas frescas y con niebla en los valles, '
    + 'tardes calurosas. La previsión se pide para el punto medio de la etapa y para las horas '
    + 'en que estaréis caminando.</div>';
}

/* Aviso para las etapas que YA tienen previsión pero están lejos. El dato es
   real, viene de Open-Meteo; lo que no es de fiar es su exactitud. Se enseña
   marcado en vez de esconderlo, que es lo que se pidió: «hasta donde llegue». */
function avisoOrientativa(et){
  if(!Meteo.disponible(et.fecha) || Meteo.fiable(et.fecha)) return '';
  return '<div class="nota lejos">Faltan <b>'+Meteo.diasHasta(et.fecha)+' días</b>, y a más de '
    + Meteo.DIAS_FIABLES+' la previsión cambia bastante de un día para otro. Sirve para hacerse '
    + 'una idea; no para decidir con ella qué meter en la mochila. Vuelve a mirarla según se '
    + 'acerque la fecha.</div>';
}

function seccionDia(et, color, perfil){
  const pax = tamanoGrupo(et.fecha);
  const a = et.alojamiento;

  let html = '<h2>Horario de la tita Lucila</h2><ul class="timing" style="--et:'+color+'">'
    + et.timing.map(function(t){
        return '<li class="'+(t.destacado?'destacado':'')+'"><span class="h">'+esc(t.hora)
          + '</span><span>'+esc(t.texto)
          + (t.dudoso?'<span class="dudoso">'+esc(t.dudoso)+'</span>':'')+'</span></li>';
      }).join('') + '</ul>';

  html += '<h2>Dónde dormimos</h2><dl class="dl">'
    + '<dt>Sitio</dt><dd><b>'+esc(a.nombre)+'</b></dd>'
    + '<dt>Dirección</dt><dd>'+esc(a.direccion)+'</dd>'
    + (a.checkin?'<dt>Entrada</dt><dd>'+esc(a.checkin)+'</dd>':'')
    + (a.telefono?'<dt>Teléfono</dt><dd><a href="tel:'+esc(a.telefono)+'">'+esc(a.telefono)+'</a></dd>':'')
    + (a.reserva?'<dt>Reserva</dt><dd>'+esc(a.reserva)+'</dd>':'')
    + (a.plazas?'<dt>Plazas</dt><dd>'+a.plazas
        + (a.supletorias?' + '+a.supletorias+(a.supletorias===1?' supletoria':' supletorias'):'')
        + ' para '+pax+' personas</dd>':'')
    + (a.web?'<dt>Web</dt><dd>'+a.web.map(function(u){
        return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'
          + esc(u.replace('https://',''))+'</a>'; }).join('<br>')+'</dd>':'')
    + '</dl>';
  /* La nota va en rojo solo si de verdad falta sitio. Las camas supletorias
     cuentan: Villa Xardín tiene 10 plazas para 11, pero con la supletoria ya
     no falta ninguna y salía en rojo como si siguiera el problema. */
  const camas = (a.plazas||0) + (a.supletorias||0);
  if(a.nota) html += '<div class="nota '+(a.plazas&&camas<pax?'roja':'')+'">'+esc(a.nota)+'</div>';
  if(a.extra) html += '<div class="nota">'+esc(a.extra)+'</div>';

  html += '<h2>Comer y cenar</h2><div class="bloque">';
  if(et.comidas.comida && et.comidas.comida.length)
    html += '<p class="sub">Comida</p><ul>'+et.comidas.comida.map(function(c){
      return '<li>'+esc(c)+'</li>'; }).join('')+'</ul>';
  if(et.comidas.cena && et.comidas.cena.length)
    html += '<p class="sub">Cena</p><ul>'+et.comidas.cena.map(function(c){
      return '<li>'+esc(c)+'</li>'; }).join('')+'</ul>';
  if(et.comidas.otros) html += '<p style="margin-top:.7rem">'+esc(et.comidas.otros)+'</p>';
  html += '</div>';
  if(et.comidas.nota) html += '<div class="nota roja">'+esc(et.comidas.nota)+'</div>';

  /* «Qué ver» NO va aquí: vive en Paradas y solo allí. Estaba en las dos
     pestañas, la misma lista entera, palabra por palabra. El Itinerario
     es el día (horario, cama y comida); lo que hay por el camino es
     Paradas. */

  if(et.avisos && et.avisos.length)
    html += '<h2>Avisos</h2><div class="bloque"><ul>'
      + et.avisos.map(function(v){ return '<li>'+esc(v)+'</li>'; }).join('')+'</ul></div>';

  html += '<h2>Estimación de marcha</h2><div class="marcha">'
    + '<div class="fila"><span class="lbl">Tiempo caminando</span><span class="val">'
    + (perfil?Marcha.formato(perfil.horas):'—')+'</span></div>'
    + '<div class="fila"><span class="lbl">Salida prevista</span><span class="val">'
    + esc(et.salida||'—')+'</span></div>';
  if(perfil && et.salida){
    const s = et.salida.split(':').map(Number);
    html += '<div class="fila"><span class="lbl">Llegada sin paradas</span><span class="val">'
      + Marcha.hora(s[0]*60+s[1]+perfil.horas*60)+'</span></div>';
  }
  html += '<p class="pie">El horario de la tita Lucila es más tardío porque incluye paradas '
    + 'largas. '
    + 'Esta cifra es solo marcha efectiva.</p></div>';
  return html;
}

/* Perfil de una etapa: prefiere la traza GPX, con el tiempo calculado
   sobre los hitos (que es donde el modelo Naismith tiene sentido). */
/* ------------------------------------------------------------
   Los hitos de una etapa listos para calcular tiempos.
   NO son `et.puntos` tal cual, y tiene motivo: en los datos hay dos
   estropicios que hacen mentir a cualquier estimación de marcha.

   1. El punto de destino (`tipo:'fin'`) de CINCO etapas lleva el km de la
      traza de la etapa SIGUIENTE, donde ese pueblo está casi en el km 0:
      Portomarín 0, Palas de Rei 0,25, Melide 0,89, Arzúa 0, O Pedrouzo 0.
      Como `Marcha.tramo` devuelve 0 si la distancia es negativa, el último
      trozo de la etapa no se contaba: 1,8 km en la 3 y 1,5 en la 4.
   2. En la etapa 2, «A Brea» tiene km 13,98 cuando por la guía va en el
      22,2: está mal proyectado sobre la traza. Eso metía un ida y vuelta de
      nueve kilómetros y daba 10 h de marcha para una etapa de 27,6 km.

   Se descarta todo punto que retroceda (un hito con el km mal puesto no se
   puede colocar bien adivinando: se quita) y se añade un punto final en el
   km donde acaba la traza de verdad. Los datos de `datos.js` siguen con el
   km equivocado; esto los sanea al vuelo, y por eso lo usan tanto la ficha
   de la etapa como la ventana de «¿Cuánto queda?»: si cada una lo hiciera a
   su manera, enseñarían tiempos distintos para lo mismo.
   ------------------------------------------------------------ */
const _cacheHitos = {};
function hitosLimpios(n){
  if(_cacheHitos[n]) return _cacheHitos[n];
  const et = ETAPAS[n-1];
  const tz = (typeof TRAZAS !== 'undefined') ? TRAZAS[n] : null;
  if(!et || !tz) return null;
  const out = [];
  et.puntos.forEach(function(p){
    if(typeof p.ele !== 'number' || typeof p.km !== 'number') return;
    if(out.length && p.km <= out[out.length-1].km) return;   // retrocede: fuera
    out.push(p);
  });
  if(!out.length) return null;
  const ult = tz.linea[tz.linea.length-1];
  if(out[out.length-1].km < tz.km - 0.02)
    out.push({km:tz.km, ele:ult[2], nombre:et.destino, tipo:'fin'});
  _cacheHitos[n] = out;
  return out;
}

function perfilEtapa(n){
  const et = ETAPAS[n-1];
  const gpx = Marcha.perfilTraza(n);
  const guia = Marcha.perfil(hitosLimpios(n) || et.puntos);
  if(!gpx) return guia;
  return {puntos: gpx.puntos, tramos: guia ? guia.tramos : null,
          dPos: gpx.dPos, dNeg: gpx.dNeg,
          horas: guia ? guia.horas : null,
          maxEle: gpx.maxEle, minEle: gpx.minEle, km: gpx.km,
          esGpx:true, nOrig: gpx.nOrig, hitos: et.puntos};
}

function panelEtapa(n){
  const et = ETAPAS[n-1], color = COLORES_ETAPA[n-1];
  const perfil = perfilEtapa(n);
  const camina = grupoCamina(et.fecha);   // los que hacen la etapa
  const duerme = tamanoGrupo(et.fecha);   // los que se quedan esa noche
  const kmDisputa = et.km.sumaTramos !== et.km.guia || et.km.guiaAlt;

  let cab = '<div class="et-cab" style="--et:'+color+'">'
    + '<div class="fecha">Etapa '+et.num+' \u00B7 '+et.diaSemana+' '+fechaLarga(et.fecha)+'</div>'
    + '<h1>'+esc(et.origen)+' \u2192 <em>'+esc(et.destino)+'</em></h1>'
    + '<div class="metricas">'
    + '<div class="metrica"><b>'+(perfil&&perfil.esGpx?perfil.km.toFixed(1):et.km.guia)+'</b><span>km</span></div>'
    + '<div class="metrica sube"><b>+'+(perfil?perfil.dPos:'—')+'</b><span>subida</span></div>'
    + '<div class="metrica baja"><b>\u2212'+(perfil?perfil.dNeg:'—')+'</b><span>bajada</span></div>'
    + '<div class="metrica"><b>'+(perfil?Marcha.formato(perfil.horas):'—')+'</b><span>marcha</span></div>'
    + '<div class="metrica"><b>'+camina+'</b><span>caminan</span></div>'
    + '</div></div>';
  if(kmDisputa) cab += '<div class="nota km">'+esc(et.km.nota)+'</div>';
  if(camina !== duerme)
    cab += '<div class="nota">La etapa la caminan '+camina+', pero esa noche se '
      + 'quedan '+duerme+': Alejandro vuela de vuelta desde Santiago por la tarde.</div>';

  let cuerpo;
  if(seccionActual==='perfil')       cuerpo = seccionPerfil(et, color, perfil);
  else if(seccionActual==='paradas') cuerpo = seccionParadas(et, color, perfil);
  else if(seccionActual==='sellos')  cuerpo = seccionSellos(et, color);
  else if(seccionActual==='tiempo')  cuerpo = seccionTiempo(et);
  else if(seccionActual==='dia')     cuerpo = seccionDia(et, color, perfil);
  else                               cuerpo = seccionRuta(et, color);

  return cab + cuerpo;
}

function pintarPanel(){
  const p = document.getElementById('panel');
  p.innerHTML = vistaEtapa===-1 ? panelPortada()
              : vistaEtapa===0  ? panelIndice()
              : vistaEtapa===7  ? panelRetos()
              : vistaEtapa===8  ? panelEquipaje()
              : panelEtapa(vistaEtapa);
  p.style.setProperty('--et', (vistaEtapa>=1 && vistaEtapa<=6)
    ? COLORES_ETAPA[vistaEtapa-1] : vistaEtapa===8 ? '#8A6D3B' : '#D8A33C');
  if(vistaEtapa===0){ cargarMeteoIndice(); pedirEstadoTiles(); }
  /* Solo las etapas tienen sección de tiempo. `seccionActual` puede seguir
     valiendo 'tiempo' al saltar a Retos o Equipaje, y ETAPAS[6] no existe. */
  else if(vistaEtapa>=1 && vistaEtapa<=6 && seccionActual==='tiempo') cargarMeteoEtapa(vistaEtapa);
}

/* ============================================================
   CARGA DE METEOROLOGÍA
   ============================================================ */
function cargarMeteoIndice(){
  const cont = document.getElementById('meteoIndice');
  if(!cont) return;
  const conPrevision = ETAPAS.filter(function(e){ return Meteo.disponible(e.fecha); });

  if(!conPrevision.length){
    const d = Meteo.diasHasta(ETAPAS[0].fecha);
    cont.innerHTML = '<div class="meteo-estado"><b>Previsión aún no disponible.</b><br>'
      + (d>0 ? 'Faltan '+d+' días para la primera etapa y Open-Meteo llega a '
               + Meteo.LIMITE_DIAS+'. Aparecerá aquí sola cuando entre en plazo.'
             : 'El viaje ya ha pasado.')+'</div>';
    return;
  }

  cont.innerHTML = '<div class="meteo-estado"><span class="cargando"></span>Consultando Open-Meteo\u2026</div>';
  const promesas = conPrevision.map(function(et){
    const medio = et.puntos[Math.floor(et.puntos.length/2)];
    return Meteo.pedir(medio.lat, medio.lon, et.fecha)
      .then(function(j){ return {et:et, j:j}; })
      .catch(function(){ return {et:et, j:null}; });
  });

  Promise.all(promesas).then(function(res){
    const filas = res.map(function(r){
      /* Sin dato puede ser falta de red o que Open-Meteo no alcance ese día.
         No se afirma cuál de las dos: no se sabe desde aquí. */
      if(!r.j) return '<div class="meteo-h"><span class="hh">'+r.et.fecha.slice(8)
        + ' ago</span><span class="ic">·</span><span class="ds">No se ha podido consultar '
        + '(sin red, o Open-Meteo no llega aún a ese día)</span><span></span></div>';
      const dd = r.j.daily;
      const cod = r.j.hourly.weather_code[13];
      const d = Meteo.describir(cod);
      const lejos = !Meteo.fiable(r.et.fecha);
      const clases = (dd.temperature_2m_max[0]>=30?'calor ':'')
                   + (dd.precipitation_sum[0]>=1?'moja':'');
      return '<div class="meteo-h '+clases+'"><span class="hh">'+r.et.fecha.slice(8)+' ago</span>'
        + '<span class="ic">'+d[1]+'</span>'
        + '<span><b class="tt">'+Math.round(dd.temperature_2m_max[0])+'°</b>'
        + '<span class="ds"> / '+Math.round(dd.temperature_2m_min[0])+'° · '+esc(d[0])+'</span>'
        + (lejos ? '<span class="lejos-tag">orientativa</span>' : '') + '<br>'
        + '<span class="ds">'+esc(r.et.destino)+'</span></span>'
        + '<span class="pp">'+dd.precipitation_sum[0].toFixed(1)+' mm</span></div>';
    }).join('');
    const fuera = ETAPAS.length - conPrevision.length;
    const orientativas = conPrevision.filter(function(e){ return !Meteo.fiable(e.fecha); }).length;
    cont.innerHTML = filas
      + (orientativas>0
        ? '<div class="nota lejos">'+(orientativas===1 ? 'Una etapa está' : orientativas+' etapas están')
          + ' a más de '+Meteo.DIAS_FIABLES+' días. Su previsión es real —viene de Open-Meteo— '
          + 'pero a esa distancia cambia bastante de un día para otro.</div>' : '')
      + (fuera>0
        ? '<div class="meteo-estado">Las otras '+fuera+' etapas están a más de '
          + Meteo.LIMITE_DIAS+' días, que es hasta donde llega Open-Meteo.</div>' : '');
  });
}

/* ¿Por dónde estará el grupo entre dos instantes (en minutos desde
   medianoche)?  Devuelve los extremos del tramo que solapa con la
   marcha, o null si en ese rato ya no están caminando.  Se apoya en
   Marcha.horarios(et), que da el paso estimado por cada hito. */
function tramoEnIntervalo(et, minIni, minFin){
  const hor = Marcha.horarios(et);
  if(!hor || !hor.length) return null;
  const salida = hor[0].minutos, llegada = hor[hor.length-1].minutos;
  const a = Math.max(minIni, salida), b = Math.min(minFin, llegada);
  if(a >= b) return null;                      // fuera de la marcha
  let A = hor[0].punto, B = hor[hor.length-1].punto;
  for(let i=0;i<hor.length;i++){ if(hor[i].minutos <= a) A = hor[i].punto; else break; }
  for(let i=0;i<hor.length;i++){ if(hor[i].minutos >= b){ B = hor[i].punto; break; } }
  return {A:A.nombre, B:B.nombre};
}

/* Avisos derivados de la previsión ya descargada. Silencio si no hay
   nada que decir: mejor eso que un aviso vacío. Tono informativo, sin
   alarmismo. `h` es j.hourly; [desde,hasta] las horas que se muestran. */
function avisosMeteo(h, desde, hasta, et){
  const avisos = [];

  /* Frío de mañana: a la hora de salida, menos de 12°. */
  const hor = Marcha.horarios(et);
  if(hor){
    const hSalida = Math.floor(hor[0].minutos/60);
    const tSalida = h.temperature_2m[hSalida];
    if(tSalida != null && tSalida < 12)
      avisos.push('A la salida (' + esc(et.salida || Marcha.hora(hor[0].minutos))
        + ') rondará los ' + Math.round(tSalida) + '°: conviene llevar algo de abrigo a mano '
        + 'para el arranque, aunque luego caliente.');
  }

  /* Calor: tres o más horas seguidas por encima de 30°. */
  for(let i=desde; i<=hasta; ){
    if(h.temperature_2m[i] > 30){
      let j = i, pico = h.temperature_2m[i];
      while(j+1 <= hasta && h.temperature_2m[j+1] > 30){ j++; if(h.temperature_2m[j] > pico) pico = h.temperature_2m[j]; }
      if(j - i + 1 >= 3){
        let msg = 'De ' + String(i).padStart(2,'0') + ':00 a ' + String(j).padStart(2,'0')
          + ':00 se superan los ' + Math.round(pico) + '°.';
        const tr = tramoEnIntervalo(et, i*60, (j+1)*60);
        if(tr) msg += tr.A === tr.B
          ? ' Para entonces estaréis por ' + esc(tr.A) + '; buscad sombra y agua.'
          : ' Para entonces estaréis en el tramo de ' + esc(tr.A) + ' a ' + esc(tr.B)
            + '; buscad sombra y agua.';
        else msg += ' Cae en las horas de más calor, ya sin caminar.';
        avisos.push(msg);
      }
      i = j + 1;
    } else i++;
  }

  /* Lluvia: alguna hora por encima del 60% de probabilidad. */
  let lo = -1, hi = -1, ppMax = 0;
  for(let i=desde; i<=hasta; i++){
    if(h.precipitation_probability[i] > 60){
      if(lo < 0) lo = i;
      hi = i;
      if(h.precipitation_probability[i] > ppMax) ppMax = h.precipitation_probability[i];
    }
  }
  if(lo >= 0){
    const cuando = lo === hi
      ? 'A las ' + String(lo).padStart(2,'0') + ':00'
      : 'De ' + String(lo).padStart(2,'0') + ':00 a ' + String(hi).padStart(2,'0') + ':00';
    const cifra = lo === hi ? ppMax + '%' : 'hasta ' + ppMax + '%';
    avisos.push(cuando + ' la probabilidad de lluvia pasa del 60% (' + cifra
      + '): chubasquero a mano.');
  }

  /* Viento: solo si supera 30 km/h. */
  let vLo = -1, vHi = -1, vMax = 0;
  for(let i=desde; i<=hasta; i++){
    if(h.wind_speed_10m[i] > 30){
      if(vLo < 0) vLo = i;
      vHi = i;
      if(h.wind_speed_10m[i] > vMax) vMax = h.wind_speed_10m[i];
    }
  }
  if(vLo >= 0)
    avisos.push('Viento de hasta ' + Math.round(vMax) + ' km/h ' + (vLo === vHi
      ? 'a las ' + String(vLo).padStart(2,'0') + ':00.'
      : 'entre las ' + String(vLo).padStart(2,'0') + ':00 y las '
        + String(vHi).padStart(2,'0') + ':00.'));

  if(!avisos.length) return '';
  return avisos.map(function(a){ return '<div class="nota">' + a + '</div>'; }).join('');
}

function cargarMeteoEtapa(n){
  const et = ETAPAS[n-1];
  const cont = document.getElementById('meteoEtapa');
  if(!cont || !Meteo.disponible(et.fecha)) return;
  const medio = et.puntos[Math.floor(et.puntos.length/2)];

  Meteo.pedir(medio.lat, medio.lon, et.fecha).then(function(j){
    const h = j.hourly, dd = j.daily;
    const horarios = Marcha.horarios(et);
    const desde = horarios ? Math.max(0, Math.floor(horarios[0].minutos/60)) : 8;
    const hasta = horarios ? Math.min(23, Math.ceil(horarios[horarios.length-1].minutos/60)) : 15;
    let filas = '';
    for(let hh=desde; hh<=hasta; hh++){
      const d = Meteo.describir(h.weather_code[hh]);
      const t = h.temperature_2m[hh], st = h.apparent_temperature[hh];
      const pp = h.precipitation_probability[hh], v = h.wind_speed_10m[hh];
      filas += '<div class="meteo-h '+(t>=30?'calor ':'')+(pp>=50?'moja':'')+'">'
        + '<span class="hh">'+String(hh).padStart(2,'0')+':00</span>'
        + '<span class="ic">'+d[1]+'</span>'
        + '<span><b class="tt">'+Math.round(t)+'\u00B0</b><span class="ds"> sensación '
        + Math.round(st)+'\u00B0 \u00B7 '+esc(d[0])+' \u00B7 viento '+Math.round(v)+' km/h</span></span>'
        + '<span class="pp">'+pp+' %</span></div>';
    }
    cont.innerHTML = '<div class="meteo-resumen">'
      + '<div><b>'+Math.round(dd.temperature_2m_max[0])+'\u00B0</b><span>máxima</span></div>'
      + '<div><b>'+Math.round(dd.temperature_2m_min[0])+'\u00B0</b><span>mínima</span></div>'
      + '<div><b>'+dd.precipitation_sum[0].toFixed(1)+'</b><span>mm de lluvia</span></div></div>'
      + avisosMeteo(h, desde, hasta, et)
      + '<div class="meteo-grid">'+filas+'</div>'
      + '<div class="nota">Amanece a las '+dd.sunrise[0].slice(11,16)+' y anochece a las '
      + dd.sunset[0].slice(11,16)+'. Datos para el punto medio de la etapa ('
      + esc(medio.nombre)+'), hora peninsular.</div>'
      + '<button class="btn-recargar" onclick="Meteo.cache.clear();cargarMeteoEtapa('+n+')">Actualizar</button>';
  }).catch(function(e){
    cont.innerHTML = '<div class="meteo-estado"><b>No se ha podido consultar la previsión.</b><br>'
      + esc(e.message)+'. Comprueba la conexión.<br>'
      + '<button class="btn-recargar" onclick="cargarMeteoEtapa('+n+')">Reintentar</button></div>';
  });
}


/* ============================================================
   GEOLOCALIZACIÓN
   Sitúa al peregrino sobre la traza y calcula lo hecho y lo que
   queda de verdad, no según el slider.
   ============================================================ */
const Geo = {
  activo: false,
  watchId: null,
  ultima: null,      // {lat, lon, precision, km, desvio, etapa}
  marcador: null,
  _centrarAlLlegar: false,   // el FAB pidió centrar en cuanto haya posición

  soportado: function(){
    return 'geolocation' in navigator;
  },

  /* Estado visual compartido por el botón "Dónde estoy" de la cabecera y el
     FAB de ubicación del mapa. estado: 'off' | 'buscando' | 'activo'. */
  _pintarBotones: function(estado){
    const btn = document.getElementById('btnGeo');
    if(btn){
      btn.classList.remove('buscando','activo');
      if(estado==='buscando'){ btn.classList.add('buscando'); btn.textContent='Buscando…'; }
      else if(estado==='activo'){ btn.classList.add('activo'); btn.textContent='Siguiendo'; }
      else btn.textContent='Dónde estoy';
    }
    const fab = document.getElementById('miUbi');
    if(fab){ fab.classList.remove('buscando','activo'); if(estado!=='off') fab.classList.add(estado); }
  },

  /* Proyecta una coordenada sobre la traza: devuelve el km
     acumulado del vértice más cercano y a qué distancia está. */
  proyectar: function(lat, lon, n){
    if(typeof TRAZAS==='undefined' || !TRAZAS[n]) return null;
    const linea = TRAZAS[n].linea;
    let mejor = null;
    for(let i=0;i<linea.length;i++){
      const q = linea[i];
      const d = Marcha.distancia({lat:lat,lon:lon},{lat:q[1],lon:q[0]});
      if(mejor===null || d<mejor.d) mejor = {d:d, km:q[3], ele:q[2], i:i};
    }
    return mejor;
  },

  /* Busca en qué etapa estás: la que te pilla más cerca */
  etapaMasCercana: function(lat, lon){
    let mejor = null;
    for(let n=1;n<=6;n++){
      const p = this.proyectar(lat, lon, n);
      if(p && (mejor===null || p.d<mejor.p.d)) mejor = {n:n, p:p};
    }
    return mejor;
  },

  iniciar: function(){
    if(!this.soportado()){
      avisar('Este navegador no permite geolocalización.');
      return;
    }
    if(this.activo){ this.parar(); return; }

    this._pintarBotones('buscando');

    this.watchId = navigator.geolocation.watchPosition(
      this.alRecibir.bind(this),
      this.alFallar.bind(this),
      {enableHighAccuracy:true, timeout:15000, maximumAge:5000}
    );
    this.activo = true;
  },

  parar: function(){
    if(this.watchId!==null) navigator.geolocation.clearWatch(this.watchId);
    this.watchId = null;
    this.activo = false;
    this.ultima = null;
    this._centrarAlLlegar = false;
    if(this.marcador){ try{ this.marcador.remove(); }catch(e){} this.marcador = null; }
    this._pintarBotones('off');
    pintarBarraGeo();
  },

  alRecibir: function(pos){
    const lat = pos.coords.latitude, lon = pos.coords.longitude;
    const prec = pos.coords.accuracy;

    /* Si estás viendo una etapa concreta, proyecta sobre ella;
       si estás en el índice, busca la etapa más cercana. */
    let n = vistaEtapa, p;
    if(n>=1 && n<=6){
      p = this.proyectar(lat, lon, n);
    } else {
      const m = this.etapaMasCercana(lat, lon);
      if(m){ n = m.n; p = m.p; }
    }
    if(!p) return;

    this.ultima = {lat:lat, lon:lon, precision:prec, km:p.km,
                   desvio:p.d, ele:p.ele, etapa:n};

    this._pintarBotones('activo');

    if(mapa && mapaListo){
      if(!this.marcador){
        const el = document.createElement('div');
        el.className = 'mk mk-yo';
        el.innerHTML = '<span class="pulso"></span>';
        this.marcador = new maplibregl.Marker({element:el, anchor:'center'})
          .setLngLat([lon,lat]).addTo(mapa);
      } else {
        this.marcador.setLngLat([lon,lat]);
      }
      /* Si el FAB pidió centrar antes de tener posición, se centra ahora,
         con la primera lectura, y a un zoom cómodo para caminar. */
      if(this._centrarAlLlegar){
        this._centrarAlLlegar = false;
        try{ mapa.flyTo({center:[lon,lat], zoom:16, duration:800}); }catch(e){}
      }
    }
    pintarBarraGeo();
    /* Si estás mirando la ruta o las paradas de tu etapa, refresca
       las distancias para que reflejen dónde estás ahora. */
    if(vistaEtapa === n && (seccionActual === 'ruta' || seccionActual === 'paradas')){
      pintarPanel();
    }
  },

  alFallar: function(err){
    this._pintarBotones('off');
    this._centrarAlLlegar = false;
    this.activo = false;
    const msg = err.code===1 ? 'Has denegado el permiso de ubicación. Actívalo en los ajustes del navegador.'
              : err.code===2 ? 'No se ha podido determinar la posición. Prueba a salir a cielo abierto.'
              : 'La búsqueda de posición ha tardado demasiado.';
    avisar(msg);
  },

  centrar: function(){
    if(this.ultima && mapa && mapaListo){
      mapa.flyTo({center:[this.ultima.lon, this.ultima.lat], zoom:15, duration:800});
      mostrarMapa(true);
    }
  },

  /* El FAB de ubicación del mapa. Reutiliza toda la lógica de arriba:
     - Si ya hay posición, centra en ella con zoom cómodo para caminar (16).
     - Si la geo no está activa (o aún busca), la activa y centra en cuanto
       llegue la primera lectura (via _centrarAlLlegar en alRecibir).
     - Si el permiso está denegado, alFallar muestra el aviso de siempre. */
  centrarEnMi: function(){
    if(!this.soportado()){
      avisar('Este navegador no permite geolocalización.');
      return;
    }
    mostrarMapa(true);
    if(this.ultima){
      if(mapa && mapaListo){
        try{ mapa.flyTo({center:[this.ultima.lon, this.ultima.lat], zoom:16, duration:800}); }catch(e){}
      }
      return;
    }
    this._centrarAlLlegar = true;
    if(!this.activo) this.iniciar();
  }
};

/* Barra fija con la posición actual y el siguiente hito */
function pintarBarraGeo(){
  const barra = document.getElementById('barraGeo');
  if(!barra) return;
  const u = Geo.ultima;

  if(!u){ barra.style.display='none'; barra.innerHTML=''; return; }

  const et = ETAPAS[u.etapa-1];
  const traza = TRAZAS[u.etapa];
  const quedan = Math.max(0, traza.km - u.km);
  const sig = siguienteHito(u.etapa, u.km);

  let aviso = '';
  if(u.desvio > 0.25){
    aviso = '<div class="geo-aviso">Estás a '+Math.round(u.desvio*1000)
          + ' m de la traza. ¿Te has salido del camino?</div>';
  }

  let bloqueSig = '';
  if(sig){
    const dist = sig.km - u.km;
    const horas = Marcha.tramo(dist, (sig.ele||u.ele) - u.ele);
    bloqueSig = '<div class="geo-sig"><span class="lbl">Siguiente</span>'
      + '<b>'+esc(sig.nombre)+'</b>'
      + '<span class="det">a '+dist.toFixed(1)+' km \u00B7 '+Marcha.formato(horas)+'</span></div>';
  } else {
    bloqueSig = '<div class="geo-sig"><span class="lbl">Siguiente</span>'
      + '<b>Ya has llegado</b><span class="det">'+esc(et.destino)+'</span></div>';
  }

  barra.style.display='block';
  barra.innerHTML = aviso
    + '<div class="geo-fila">'
    + '<div class="geo-dato"><b>'+u.km.toFixed(1)+'</b><span>km hechos</span></div>'
    + '<div class="geo-dato"><b>'+quedan.toFixed(1)+'</b><span>km quedan</span></div>'
    + '<div class="geo-dato"><b>'+Math.round(u.ele)+'</b><span>altitud</span></div>'
    + '<div class="geo-dato"><b>\u00B1'+Math.round(u.precision)+'</b><span>precisión m</span></div>'
    + '</div>' + bloqueSig
    + '<div class="geo-acciones">'
    + '<button onclick="Geo.centrar()">Ver en el mapa</button>'
    + '<button onclick="irA('+u.etapa+')">Ir a la etapa '+u.etapa+'</button>'
    + '<button onclick="Geo.parar()">Dejar de seguir</button>'
    + '</div>';
}

/* El primer hito con nombre que queda por delante */
function siguienteHito(n, km){
  const et = ETAPAS[n-1];
  for(let i=0;i<et.puntos.length;i++){
    const p = et.puntos[i];
    if(p.km > km + 0.05 && p.tipo!=='paso') return p;
  }
  return null;
}

/* ============================================================
   ¿CUÁNTO QUEDA?
   Ventana con lo que falta hasta el final de la etapa: distancia,
   tiempo de marcha y cuenta atrás hasta la hora de llegada que
   marca la guía. Elige la etapa sola, por este orden: dónde estás,
   qué día es, qué tienes abierto y, si nada de eso vale, la 1.
   ============================================================ */

/* La última hora que aparece en una casilla del timing: '13:30-15:30' da
   15:30 y '13:30 / 14:30' da 14:30. Interesa el final, no el principio. */
function ultimaHoraDe(txt){
  const m = String(txt == null ? '' : txt).match(/\d{1,2}:\d{2}/g);
  return (m && m.length) ? m[m.length-1] : null;
}

/* Hora de llegada prevista de una etapa, sacada de su timing en vez de
   escrita a mano, para que siga a los datos si cambian. Se busca la línea
   «Llegada a <destino>»; cinco de las seis etapas la tienen. La 2 no, así
   que cae a la última hora del timing (13:30-15:30 → 15:30), que es su
   tramo final «Ligonde-Palas de Rei». Ojo: NO vale coger la última línea
   que diga «Llegada a», porque en la etapa 2 esa es «Llegada a Gonzar» a
   las 9:30, a mitad de camino. */
function horaLlegadaEtapa(n){
  const e = ETAPAS[n-1];
  if(!e) return null;
  const t = e.timing || [];
  const corto = String(e.destino).split(' de ')[0];
  let hora = null;
  t.forEach(function(x){
    const s = x.texto || '';
    if(/llegada a/i.test(s) && (s.indexOf(e.destino) >= 0 || s.indexOf(corto) >= 0))
      hora = x.hora;
  });
  if(hora === null && t.length) hora = t[t.length-1].hora;
  return hora === null ? (e.salida || null) : ultimaHoraDe(hora);
}

/* El instante exacto en que la guía espera que lleguéis al final de la etapa. */
function metaEtapa(n){
  const e = ETAPAS[n-1];
  if(!e) return null;
  const f = e.fecha.split('-').map(Number);
  const hm = String(horaLlegadaEtapa(n) || '00:00').split(':').map(Number);
  return new Date(f[0], f[1]-1, f[2], hm[0] || 0, hm[1] || 0, 0, 0);
}

const Queda = {
  _tim: null,
  _foco: null,

  abierto: function(){
    const el = document.getElementById('queda');
    return !!(el && !el.hidden);
  },

  hitos: function(n){ return hitosLimpios(n); },

  /* ---- Desnivel que queda ----
     El desnivel NO se saca de los hitos, aunque el tiempo sí. Motivo: la
     ficha de la etapa enseña el de la traza GPX (+403 / −535 en la 1) y los
     hitos, que son veinte puntos sueltos, dan +259 / −365. Dos números
     distintos para lo mismo en dos pantallas seguidas confunden.

     Se cuenta sobre la traza con umbral de 10 m (el ruido del GPS mete
     subidas y bajadas que no existen) y luego se ANCLA al total publicado en
     TRAZAS por proporción. Así, en el km 0 sale exactamente lo que dice la
     ficha, y a mitad de etapa sale la parte proporcional. Hace falta anclar
     porque los totales de `trazas.js` se calcularon sobre la traza original
     de 3470 puntos y aquí solo queda la simplificada a 12 m: reproducirlos
     tal cual no sale (la 1 da −530 en vez de −535). */
  _desnivelCrudo: function(n, km){
    const L = TRAZAS[n].linea;
    let dP = 0, dN = 0, ref = null;
    for(let i=0;i<L.length;i++){
      if(L[i][3] < km) continue;
      if(ref === null){ ref = L[i][2]; continue; }
      const e = L[i][2];
      if(e - ref >= 10){ dP += e - ref; ref = e; }
      else if(ref - e >= 10){ dN += ref - e; ref = e; }
    }
    return {dP:dP, dN:dN};
  },
  desnivel: function(n, km){
    const tz = TRAZAS[n];
    const base = this._desnivelCrudo(n, 0);
    const resto = km > 0 ? this._desnivelCrudo(n, km) : base;
    return {
      dPos: Math.round(tz.dPos * (base.dP > 0 ? resto.dP / base.dP : 0)),
      dNeg: Math.round(tz.dNeg * (base.dN > 0 ? resto.dN / base.dN : 0))
    };
  },

  /* Qué etapa mirar y por qué. El orden importa: dónde estás manda sobre la
     fecha, y la fecha sobre lo que tengas abierto. */
  objetivo: function(){
    const u = (typeof Geo !== 'undefined') ? Geo.ultima : null;
    if(u && u.etapa >= 1 && u.etapa <= 6 && u.desvio <= 2)
      return {n:u.etapa, motivo:'Contando desde donde estás ahora mismo.'};
    const iso = isoHoy();
    for(let i=0;i<ETAPAS.length;i++)
      if(ETAPAS[i].fecha === iso)
        return {n:ETAPAS[i].num, motivo:'La etapa de hoy.'};
    if(vistaEtapa >= 1 && vistaEtapa <= 6)
      return {n:vistaEtapa, motivo:'La etapa que tienes abierta.'};
    return {n:1, motivo:'El Camino no ha empezado todavía, así que te enseño la primera etapa.'};
  },

  /* Todo lo que hay que saber de una etapa desde el km en el que estés.
     Sin ubicación se calcula la etapa entera (km 0). */
  calcular: function(n){
    const et = ETAPAS[n-1], tz = TRAZAS[n], pts = this.hitos(n);
    if(!et || !tz || !pts) return null;

    const u = (typeof Geo !== 'undefined') ? Geo.ultima : null;
    const situado = !!(u && u.etapa === n);
    const km = situado ? Math.min(Math.max(u.km, 0), tz.km) : 0;

    /* El tiempo sí sale de los hitos: es el mismo modelo (Naismith-Langmuir
       sobre los puntos de la guía) que usa el resto de la web para decir
       cuánto se tarda, y conviene que no discrepen. */
    let horas = 0;
    for(let i=1;i<pts.length;i++){
      const a = pts[i-1], b = pts[i];
      if(b.km <= km) continue;
      const largo = b.km - a.km;
      const desde = Math.max(a.km, km);
      const d = b.km - desde;
      const dh = largo > 0 ? (b.ele - a.ele) * (d / largo) : 0;
      horas += Marcha.tramo(d, dh);
    }
    const dn = this.desnivel(n, km);

    let sig = null;
    for(let i=0;i<pts.length;i++){
      if(pts[i].km > km + 0.05 && pts[i].tipo !== 'paso' && pts[i].nombre){ sig = pts[i]; break; }
    }

    return {
      n:n, et:et, situado:situado, desvio: situado ? u.desvio : null,
      km:km, kmTotal:tz.km, kmQuedan:Math.max(0, tz.km - km),
      pct: tz.km > 0 ? Math.min(100, Math.round(km * 100 / tz.km)) : 0,
      horas:horas, dPos:dn.dPos, dNeg:dn.dNeg,
      sig:sig, meta:metaEtapa(n), horaGuia:horaLlegadaEtapa(n)
    };
  },

  abrir: function(){
    const el = document.getElementById('queda');
    if(!el) return;
    this._foco = document.activeElement;
    el.hidden = false;
    this.pintar();
    const x = document.getElementById('quedaX');
    if(x) try{ x.focus(); }catch(e){}
    /* Cada segundo: la cuenta atrás baja de minuto y, si estás caminando, la
       hora de llegada estimada se mueve contigo. */
    clearInterval(this._tim);
    this._tim = setInterval(this.pintar.bind(this), 1000);
  },

  cerrar: function(){
    const el = document.getElementById('queda');
    if(!el) return;
    el.hidden = true;
    clearInterval(this._tim);
    this._tim = null;
    if(this._foco) try{ this._foco.focus(); }catch(e){}
    this._foco = null;
  },

  /* La cuenta atrás en palabras. Con más de un día se enseñan días; con menos
     de una hora, también los segundos, que es cuando entretiene mirarlo. */
  cuentaAtras: function(ms){
    const s = Math.floor(ms / 1000);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const seg = s % 60;
    if(d > 0) return d + (d === 1 ? ' día ' : ' días ') + h + ' h ' + String(m).padStart(2,'0') + ' min';
    if(h > 0) return h + ' h ' + String(m).padStart(2,'0') + ' min';
    return m + ' min ' + String(seg).padStart(2,'0') + ' s';
  },

  pintar: function(){
    const cuerpo = document.getElementById('quedaCuerpo');
    if(!cuerpo) return;
    const obj = this.objetivo();
    const c = this.calcular(obj.n);
    if(!c){
      cuerpo.innerHTML = '<p class="q-tit" id="quedaT">No hay datos de esa etapa</p>';
      return;
    }
    const et = c.et;
    const ahora = new Date();

    let html = '<div class="q-cab">Etapa ' + c.n + ' · ' + esc(et.diaSemana) + ' '
      + et.fecha.slice(8) + ' de agosto</div>'
      + '<p class="q-tit" id="quedaT">Hasta <em>' + esc(et.destino) + '</em></p>'
      + '<p class="q-por">' + esc(obj.motivo) + '</p>';

    /* --- El temporizador --- */
    const ms = c.meta ? (c.meta - ahora) : null;
    if(ms === null){
      html += '<div class="q-reloj"><b>—</b><span>Sin hora de llegada en la guía</span></div>';
    } else if(ms > 0){
      html += '<div class="q-reloj"><b>' + this.cuentaAtras(ms) + '</b>'
        + '<span>para la llegada prevista a ' + esc(et.destino) + ', '
        + 'las ' + esc(c.horaGuia) + ' del ' + esc(et.diaSemana) + ' '
        + et.fecha.slice(8) + '</span></div>';
    } else {
      html += '<div class="q-reloj pasado"><b>La hora prevista ya ha pasado</b>'
        + '<span>La guía daba las ' + esc(c.horaGuia) + ' para llegar a '
        + esc(et.destino) + '</span></div>';
    }

    /* --- Lo que falta --- */
    html += '<div class="q-datos">'
      + '<div class="q-dato"><b>' + c.kmQuedan.toFixed(1) + ' km</b><span>'
      + (c.situado ? 'te quedan' : 'tiene la etapa') + '</span></div>'
      + '<div class="q-dato"><b>' + Marcha.formato(c.horas) + '</b><span>'
      + (c.situado ? 'de marcha por delante' : 'de marcha en total') + '</span></div>'
      + '<div class="q-dato"><b>+' + c.dPos + ' m</b><span>subida que queda</span></div>'
      + '<div class="q-dato"><b>−' + c.dNeg + ' m</b><span>bajada que queda</span></div>';

    if(c.situado){
      const llegada = new Date(ahora.getTime() + c.horas * 3600000);
      const hh = String(llegada.getHours()).padStart(2,'0') + ':'
               + String(llegada.getMinutes()).padStart(2,'0');
      html += '<div class="q-dato ancho"><b>' + hh + '</b>'
        + '<span>llegarías a esa hora si sales ya y mantienes el ritmo</span></div>';
    }
    html += '</div>';

    if(c.situado){
      html += '<div class="q-barra"><i style="width:' + c.pct + '%"></i></div>'
        + '<p class="q-por" style="margin-top:.35rem">Llevas ' + c.km.toFixed(1)
        + ' de ' + c.kmTotal.toFixed(1) + ' km (' + c.pct + ' %).'
        + (c.sig ? ' Siguiente: <b>' + esc(c.sig.nombre) + '</b>, a '
            + (c.sig.km - c.km).toFixed(1) + ' km.' : '')
        + '</p>';
      /* Aquí NO vale la clase `nota roja`: su ::before mete un "Sin verificar ·"
         que no pinta nada en este aviso. */
      if(c.desvio > 0.25)
        html += '<div class="q-ojo">Estás a ' + Math.round(c.desvio*1000)
          + ' m de la traza, así que esto es orientativo. ¿Te has salido del camino?</div>';
    } else {
      html += '<div class="nota" style="margin-top:.7rem">Estos son los números de la '
        + 'etapa entera, de ' + esc(et.origen) + ' a ' + esc(et.destino) + '. Para que '
        + 'cuente desde donde estés, pulsa <b>Dónde estoy</b> y vuelve a abrir esto.</div>';
    }

    html += '<div class="nota" style="margin-top:.5rem">El tiempo de marcha es una '
      + 'estimación (Naismith con corrección Langmuir) y <b>no cuenta las paradas</b>. '
      + 'La hora de llegada es la que puso la tita Lucila en su guía.</div>';

    html += '<div class="q-acciones">';
    if(!c.situado)
      html += '<button class="btn-recargar" onclick="Geo.iniciar()">Dónde estoy</button>';
    html += '<button class="btn-recargar" onclick="Queda.cerrar();irA(' + c.n + ')">'
      + 'Ver la etapa ' + c.n + '</button>'
      + '<button class="btn-recargar" onclick="Queda.cerrar()">Cerrar</button></div>';

    cuerpo.innerHTML = html;
  }
};

/* ============================================================
   SELLOS
   La Compostela exige dos sellos por día en los últimos 100 km.
   Se guardan en el navegador de cada uno: son marcas personales,
   no datos del viaje. Si se pierden no pasa nada, y hay botón
   para copiarlos como texto.
   ============================================================ */
const Sellos = {
  CLAVE: 'lolitas2026-sellos',
  datos: null,

  cargar: function(){
    if(this.datos) return this.datos;
    try{
      const s = localStorage.getItem(this.CLAVE);
      this.datos = s ? JSON.parse(s) : {};
    }catch(e){ this.datos = {}; }
    return this.datos;
  },

  guardar: function(){
    try{ localStorage.setItem(this.CLAVE, JSON.stringify(this.datos)); }
    catch(e){ /* modo privado o sin espacio: se pierde al cerrar, no es grave */ }
  },

  marcado: function(id){
    return !!this.cargar()[id];
  },

  alternar: function(id){
    this.cargar();
    if(this.datos[id]) delete this.datos[id];
    else this.datos[id] = new Date().toISOString().slice(0,16).replace('T',' ');
    this.guardar();
    if(seccionActual==='sellos') pintarPanel();
    pintarSubnav();
  },

  cuenta: function(n){
    const et = ETAPAS[n-1];
    const lugares = this.lugares(n);
    let hechos = 0;
    lugares.forEach(function(l){ if(Sellos.marcado(l.id)) hechos++; });
    return {hechos:hechos, total:lugares.length};
  },

  /* Sitios donde sellar en una etapa: los marcados con sellar,
     más el alojamiento (todos sellan) y los bares del recorrido. */
  lugares: function(n){
    const et = ETAPAS[n-1];
    const out = [];
    et.puntos.forEach(function(p){
      if(p.sellar || p.tipo==='iglesia' || p.tipo==='comida' || p.tipo==='taxi'){
        /* El km desambigua nombres que se truncan igual, como
           "Iglesia de Santiago de Barbadelo" y "...de Boente" */
        out.push({id:'e'+n+'-'+p.km+'-'+p.nombre.replace(/[^\wáéíóúñ]/gi,'').slice(0,20),
                  nombre:p.nombre, km:p.km, tipo:p.tipo,
                  oficial:!!p.sellar, horario:p.horario});
      }
    });
    out.push({id:'e'+n+'-aloj', nombre:et.alojamiento.nombre, km:null,
              tipo:'albergue', oficial:true,
              horario:et.alojamiento.checkin?'desde '+et.alojamiento.checkin:null});
    return out;
  },

  comoTexto: function(){
    const d = this.cargar();
    let t = 'Sellos del Camino \u2014 Las Lolitas, agosto 2026\n\n';
    for(let n=1;n<=6;n++){
      const et = ETAPAS[n-1];
      t += 'Etapa '+n+' \u2014 '+et.fecha+' \u2014 '+et.origen+' a '+et.destino+'\n';
      const ls = this.lugares(n);
      ls.forEach(function(l){
        t += (d[l.id] ? '  [x] ' : '  [ ] ') + l.nombre
           + (d[l.id] ? '  ('+d[l.id]+')' : '') + '\n';
      });
      t += '\n';
    }
    return t;
  },

  copiar: function(){
    const t = this.comoTexto();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){
        avisar('Sellos copiados al portapapeles.');
      }).catch(function(){ avisar('No se ha podido copiar.'); });
    } else {
      avisar('Este navegador no permite copiar automáticamente.');
    }
  },

  borrar: function(){
    if(!confirm('¿Borrar todos los sellos marcados? No se puede deshacer.')) return;
    this.datos = {};
    this.guardar();
    pintarPanel();
    pintarSubnav();
  }
};

/* ============================================================
   AVISOS BREVES
   Los mensajitos flotantes de abajo. Su elemento es `#aviso`, y NO tiene
   nada que ver con `Recado` (la ventana que sale al abrir la web, que es
   `#recado`). Llegaron a llamarse igual y el CSS de este —`opacity:0`
   hasta que se le pone `.visible`— dejaba la ventana invisible.
   ============================================================ */
let avisoTimer = null;
function avisar(texto){
  let el = document.getElementById('aviso');
  if(!el){
    el = document.createElement('div');
    el.id = 'aviso';
    document.body.appendChild(el);
  }
  el.textContent = texto;
  el.classList.add('visible');
  clearTimeout(avisoTimer);
  avisoTimer = setTimeout(function(){ el.classList.remove('visible'); }, 4200);
}

/* ============================================================
   COMPARTIR
   ============================================================ */
function compartir(n){
  /* Directorio donde vive el sitio (quita el "index.html" final si lo hay). */
  const raiz = location.origin + location.pathname.replace(/[^/]*$/, '');
  /* Para una etapa se comparte etapaN.html, la página con las etiquetas Open
     Graph propias (mapa, km, desnivel): así WhatsApp muestra su vista previa
     y no la genérica. Esa página redirige al visor. El índice comparte la raíz. */
  /* Solo las etapas 1-6 tienen su etapaN.html; portada, índice, retos (7) y
     equipaje (8) comparten la raíz. */
  const esEtapa = n >= 1 && n <= 6;
  const url = esEtapa ? raiz + 'etapa' + n + '.html' : raiz;
  const et = esEtapa ? ETAPAS[n-1] : null;
  const texto = et
    ? 'Las Lolitas al Camino \u2014 Etapa '+n+': '+et.origen+' a '+et.destino
      + ' ('+(TRAZAS[n]?TRAZAS[n].km.toFixed(1):et.km.guia)+' km), '+et.diaSemana+' '+et.fecha.slice(8)+' de agosto'
    : 'Las Lolitas al Camino \u2014 Sarria a Santiago, del 18 al 23 de agosto de 2026';

  if(navigator.share){
    navigator.share({title:'Las Lolitas al Camino', text:texto, url:url})
      .catch(function(){});
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto+'\n'+url).then(function(){
      avisar('Enlace copiado. Ya puedes pegarlo en WhatsApp.');
    }).catch(function(){ avisar('No se ha podido copiar el enlace.'); });
  } else {
    avisar(url);
  }
}


/* ============================================================
   SECCIÓN: PUNTOS DE ESCAPE, INTERÉS Y DESCANSO
   Con doce personas de edades variadas, saber dónde se puede
   parar o coger un taxi importa tanto como el recorrido.
   ============================================================ */
function seccionParadas(et, color, perfil){
  const n = et.num;
  const escapes  = et.puntos.filter(function(p){ return p.tipo==='taxi'; });
  const comidas  = et.puntos.filter(function(p){ return p.tipo==='comida'; });
  const interes  = et.puntos.filter(function(p){
    return p.tipo==='cultura' || p.tipo==='iglesia' || p.tipo==='mirador'; });

  const u = Geo.ultima;
  function distDesdeAqui(p){
    if(!u || u.etapa!==n) return '';
    const d = p.km - u.km;
    if(d < -0.1) return '<span class="pasado">ya pasado</span>';
    return '<span class="restante">a '+Math.abs(d).toFixed(1)+' km</span>';
  }

  function tarjeta(p, clase){
    return '<li><button class="hito '+(clase||'')+'" style="--c:'+color+'" '
      + 'data-nombre="'+esc(p.nombre)+'" '
      + 'onclick="alternarHito(this,'+p.lat+','+p.lon+','+p.km+')" aria-expanded="false">'
      + '<span class="nom">'+esc(p.nombre)
      + (p.sellar?'<span class="sello">Sellar</span>':'')+'</span>'
      + '<span class="km">km '+p.km+'</span>'
      + '<span class="tag">'+(ICONO[p.tipo]||p.tipo)
      + (p.horario?' \u00B7 '+esc(p.horario):'')+' '+distDesdeAqui(p)+'</span>'
      + (p.ficha?'<span class="ficha">'+esc(p.ficha)+'</span>':'')
      + '</button></li>';
  }

  let html = '';

  /* --- Escapes --- */
  html += '<h2>Puntos de escape</h2>';
  if(escapes.length){
    html += '<div class="bloque" style="margin-bottom:.5rem"><p style="font-size:.75rem;color:#5A554A">'
      + 'Sois doce, de todas las edades: aquí se puede coger un taxi o esperar al coche '
      + 'sin tener que terminar la etapa.'
      + '</p></div><ul class="hitos">'
      + escapes.map(function(p){ return tarjeta(p,'escape'); }).join('') + '</ul>';
  } else {
    html += '<div class="nota">La tita Lucila no marca puntos de escape en esta etapa.</div>';
  }

  const tels = TAXIS.filter(function(t){ return taxiEnEtapa(t, n); });
  if(tels.length){
    html += '<div class="tels">'+tels.map(taxiTel).join('')+'</div>';
  }
  if(n === 6){
    html += '<div class="nota">En O Pedrouzo no hay taxi con base propia. Lo cubren los '
      + 'de Arzúa (los de la etapa anterior) y los de Santiago. Avisad de que sois varios.</div>';
  }

  /* --- Comida por el camino ---
     Ojo: esto son los bares y pueblos DEL RECORRIDO. Los restaurantes
     reservados son otra cosa y están en Itinerario, en «Comer y cenar». */
  html += '<h2>Bares y comida</h2>';
  if(comidas.length){
    html += '<ul class="hitos">'+comidas.map(function(p){ return tarjeta(p); }).join('')+'</ul>';
  } else {
    html += '<div class="nota">La guía no marca ningún bar por el camino en esta etapa.</div>';
  }

  /* Aquí salía antes el resumen de las paradas `destacado` del horario.
     Se quitó por dos motivos: ya salen enteras en el Itinerario, y el
     rótulo («la tita Lucila propone parar aquí») mentía en dos de las
     cinco etapas en que aparecía: en la 1 es la descripción de un tramo
     («Barbadelo-Ferreiros, dificultad BAJA») y en la 6 una llegada. */

  /* --- Qué ver ---
     Primero las tarjetas, que llevan km y distancia desde donde estás.
     Después lo que no tiene punto propio, agrupado por dónde está DE
     VERDAD. Antes todo esto se pintaba bajo «Además, en el destino» y
     era falso: hay cosas del pueblo de salida y desvíos a 7 y 10 km. */
  html += '<h2>Qué ver</h2>';
  if(interes.length){
    html += '<ul class="hitos">'+interes.map(function(p){ return tarjeta(p); }).join('')+'</ul>';
  }
  if(et.cultura && et.cultura.length){
    const GRUPOS = [
      {donde:'salida',  titulo:'Al salir de '+et.origen},
      {donde:'camino',  titulo:'Por el camino'},
      {donde:'destino', titulo:'Al llegar a '+et.destino},
      {donde:'desvio',  titulo:'Fuera del Camino, hay que desviarse'}
    ];
    const bloques = GRUPOS.map(function(g){
      const items = et.cultura.filter(function(c){ return c.donde === g.donde; });
      if(!items.length) return '';
      return '<p class="sub">'+esc(g.titulo)+'</p><ul>'
        + items.map(function(c){ return '<li>'+esc(c.texto)+'</li>'; }).join('')+'</ul>';
    }).join('');
    if(bloques) html += '<div class="bloque" style="margin-top:.6rem">'+bloques+'</div>';
  }
  if(!interes.length && !(et.cultura && et.cultura.length)){
    html += '<div class="nota">La guía no marca puntos de interés en esta etapa.</div>';
  }

  return html;
}

/* ============================================================
   SECCIÓN: SELLOS
   ============================================================ */
function seccionSellos(et, color){
  const n = et.num;
  const lugares = Sellos.lugares(n);
  const c = Sellos.cuenta(n);
  const suficientes = c.hechos >= 2;

  let html = '<h2>Sellos de la credencial</h2>'
    + '<div class="sellos-estado '+(suficientes?'ok':'')+'">'
    + '<b>'+c.hechos+' de 2</b>'
    + '<span>'+(suficientes
        ? 'Ya tienes los dos sellos que exige la Compostela para hoy.'
        : 'La Compostela exige dos sellos por día en los últimos 100 km.')+'</span>'
    + '</div>'
    + '<div class="bloque" style="margin:.6rem 0"><p style="font-size:.74rem;color:#5A554A">'
    + 'Marca los que vayas consiguiendo. Se guardan en este móvil, no se comparten '
    + 'con el resto de las Lolitas: cada uno lleva su credencial.</p></div>';

  html += '<ul class="sellos">' + lugares.map(function(l){
    const m = Sellos.marcado(l.id);
    return '<li><button class="sello-item'+(m?' hecho':'')+'" '
      + 'onclick="Sellos.alternar(\''+l.id+'\')" aria-pressed="'+m+'">'
      + '<span class="caja">'+(m?'\u2713':'')+'</span>'
      + '<span class="txt"><b>'+esc(l.nombre)+'</b>'
      + (l.km!=null?'<span class="km">km '+l.km+'</span>':'<span class="km">alojamiento</span>')
      + (l.horario?'<span class="hor">'+esc(l.horario)+'</span>':'')
      + (l.oficial?'<span class="ofi">sella seguro</span>':'')
      + '</span></button></li>';
  }).join('') + '</ul>';

  html += '<div class="nota"><b>Dónde sellan además:</b> casi todos los bares, albergues, '
    + 'iglesias y ayuntamientos del camino. Si un sitio no está en esta lista pero te sella, '
    + 'vale igual.</div>';

  html += '<div class="sellos-acciones">'
    + '<button class="btn-recargar" onclick="Sellos.copiar()">Copiar todos como texto</button>'
    + '<button class="btn-recargar" onclick="Sellos.borrar()">Borrar marcas</button></div>';

  return html;
}

/* ============================================================
   EQUIPAJE — la maleta y la mochila
   Mismo planteamiento que los sellos: es una lista PERSONAL, se guarda
   solo en el navegador de cada uno y no se comparte con nadie. Cada
   Lolita hace su maleta; no tiene sentido que lo que marque una le
   aparezca marcado a otra.
   Los datos (los grupos y sus items) están en EQUIPAJE, dentro de
   datos.js; aquí solo vive el estado de lo que ya está metido.
   ============================================================ */
const Equipaje = {
  CLAVE: 'lolitas2026-equipaje',
  datos: null,

  cargar: function(){
    if(this.datos) return this.datos;
    try{
      const s = localStorage.getItem(this.CLAVE);
      this.datos = s ? JSON.parse(s) : {};
    }catch(e){ this.datos = {}; }
    return this.datos;
  },

  guardar: function(){
    try{ localStorage.setItem(this.CLAVE, JSON.stringify(this.datos)); }
    catch(e){ /* modo privado o sin espacio: se pierde al cerrar, no es grave */ }
  },

  marcado: function(id){
    return !!this.cargar()[id];
  },

  alternar: function(id){
    this.cargar();
    if(this.datos[id]) delete this.datos[id];
    else this.datos[id] = new Date().toISOString().slice(0,16).replace('T',' ');
    this.guardar();
    if(vistaEtapa === 8) pintarPanel();
    pintarNav();
  },

  /* Cuántos items de un grupo están metidos. Sin grupo, el total. */
  cuenta: function(grupo){
    const d = this.cargar();
    const grupos = grupo ? [grupo] : EQUIPAJE;
    let hechos = 0, total = 0;
    grupos.forEach(function(g){
      g.items.forEach(function(it){ total++; if(d[it.id]) hechos++; });
    });
    return {hechos:hechos, total:total};
  },

  comoTexto: function(){
    const d = this.cargar();
    let t = 'Equipaje del Camino — lista de la tita Lucila\n\n';
    EQUIPAJE.forEach(function(g){
      t += g.titulo.toUpperCase() + (g.extra ? ' (añadido por el grupo)' : '') + '\n';
      g.items.forEach(function(it){
        t += (d[it.id] ? '  [x] ' : '  [ ] ') + it.texto
           + (it.uds ? ' (' + it.uds + ')' : '') + '\n';
      });
      t += '\n';
    });
    const c = this.cuenta();
    t += 'Metido: ' + c.hechos + ' de ' + c.total + '.\n';
    return t;
  },

  copiar: function(){
    const t = this.comoTexto();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){
        avisar('Lista del equipaje copiada al portapapeles.');
      }).catch(function(){ avisar('No se ha podido copiar.'); });
    } else {
      avisar(t);
    }
  },

  borrar: function(){
    if(!confirm('¿Desmarcar todo el equipaje? No se puede deshacer.')) return;
    this.datos = {};
    this.guardar();
    pintarPanel();
    pintarNav();
  }
};

/* Aviso del equipaje en el índice, para que la lista se encuentre sin
   tener que descubrir la pestaña. Dice cómo va la maleta de este móvil. */
function equipajeIndice(){
  const c = Equipaje.cuenta();
  const listo = c.hechos === c.total;
  return '<h2>La maleta</h2>'
    + '<div class="bloque"><p style="font-size:.78rem">'
    + (listo
        ? 'Tienes marcadas las <b>' + c.total + '</b> cosas de la lista. '
        : (c.hechos
            ? 'Llevas <b>' + c.hechos + ' de ' + c.total + '</b> cosas metidas. '
            : 'Son <b>' + c.total + '</b> cosas: la lista de la tita Lucila y unas pocas '
              + 'que añadió el grupo. '))
    + 'Se marca en la pestaña <b>Equipaje</b>, y se guarda solo en este móvil.</p>'
    + '<button class="btn-recargar" style="margin-top:.5rem" onclick="irA(8)">'
    + 'Ver la lista del equipaje</button></div>';
}

/* ============================================================
   PANEL — EQUIPAJE
   ============================================================ */
function panelEquipaje(){
  const c = Equipaje.cuenta();
  const listo = c.hechos === c.total;
  const faltan = c.total - c.hechos;
  const pct = c.total ? Math.round(c.hechos * 100 / c.total) : 0;

  let html = '<div class="et-cab" style="--et:#8A6D3B">'
    + '<div class="fecha">Antes de salir</div>'
    + '<h1>Qué meter en la <em>mochila</em></h1>'
    + '<div class="metricas">'
    + '<div class="metrica"><b>' + c.hechos + '</b><span>metidas</span></div>'
    + '<div class="metrica"><b>' + faltan + '</b><span>por meter</span></div>'
    + '<div class="metrica"><b>' + c.total + '</b><span>en la lista</span></div>'
    + '</div></div>';

  html += '<div class="eq-estado' + (listo ? ' ok' : '') + '">'
    + '<b>' + pct + '%</b>'
    + '<span>' + (listo
        ? 'Maleta lista: has marcado las ' + c.total + ' cosas de la lista.'
        : 'Te quedan ' + faltan + ' cosas por meter.')
    + '<span class="eq-barra"><i style="width:' + pct + '%"></i></span></span>'
    + '</div>';

  html += '<div class="bloque" style="margin:.6rem 0"><p style="font-size:.74rem;color:#5A554A">'
    + 'La lista es la que preparó <b>la tita Lucila</b>. Marca lo que vayas metiendo: '
    + 'se guarda en este móvil y no lo ve nadie más, igual que los sellos. Cada una hace '
    + 'su maleta.</p></div>';

  EQUIPAJE.forEach(function(g){
    const cg = Equipaje.cuenta(g);
    html += '<h2>' + esc(g.titulo) + '</h2>'
      + '<div class="reto-marcador' + (g.extra ? ' fuera' : '') + '">'
      + '<b>' + cg.hechos + ' de ' + cg.total + '</b>'
      + '<span>' + (g.extra ? 'no viene en la guía'
                  : g.de ? 'de «' + esc(g.de) + '» en la guía'
                  : 'en la guía') + '</span></div>'
      /* El grupo añadido lleva su aviso encima de la lista, no solo la
         etiqueta: que no se le atribuya a la tita Lucila lo que no escribió. */
      + (g.extra ? '<div class="nota">Esto <b>no</b> está en la lista de la tita '
          + 'Lucila. Lo añadió el grupo al repasarla, porque hace falta igual.</div>' : '')
      + '<ul class="sellos">' + g.items.map(function(it){
          const m = Equipaje.marcado(it.id);
          return '<li><button class="sello-item' + (m ? ' hecho' : '') + '" '
            + 'onclick="Equipaje.alternar(\'' + it.id + '\')" aria-pressed="' + m + '">'
            + '<span class="caja">' + (m ? '✓' : '') + '</span>'
            + '<span class="txt"><b>' + esc(it.texto) + '</b>'
            + (it.uds ? '<span class="km">' + esc(it.uds) + '</span>' : '')
            /* El punto separa cantidad y aclaración cuando van las dos:
               sin él se leían pegadas ("2-3 pares Marcados"). */
            + (it.nota ? '<span class="hor">' + (it.uds ? '· ' : '')
                + esc(it.nota) + '</span>' : '')
            + '</span></button></li>';
        }).join('') + '</ul>';
  });

  /* Honestidad con la fuente: se dice de dónde sale cada cosa. Lo que no es
     suyo está arriba, en su grupo aparte, no mezclado. */
  const nExtra = EQUIPAJE.filter(function(g){ return g.extra; })
                         .reduce(function(n,g){ return n+g.items.length; }, 0);
  html += '<div class="nota"><b>De dónde sale esta lista.</b> Los cuatro primeros grupos '
    + 'son la lista de la tita Lucila, entera y sin quitar nada. Su guía trae tres '
    + 'apartados (Ropa, Calzado y Otras cosas); aquí «Otras cosas» se ha partido en '
    + '«Equipo» y «Botiquín y aseo» para que sea más corto de repasar, y las líneas que '
    + 'juntaban varias cosas se han separado para poder marcarlas una a una. '
    + 'Las ' + nExtra + ' de «Además de la guía» <b>no son suyas</b>: las añadió el grupo. '
    + 'Si echas algo más en falta, dilo y se añade ahí.</div>';

  /* El botón de WhatsApp va antes que los discretos: en móvil el botón
     flotante «Ver mapa» tapa la esquina inferior derecha del panel, y ahí
     conviene que esté lo que menos se pulsa. */
  html += '<button class="reto-wa" onclick="compartirTexto(Equipaje.comoTexto())">'
    + 'Mandar mi lista por WhatsApp</button>';

  html += '<div class="sellos-acciones">'
    + '<button class="btn-recargar" onclick="Equipaje.copiar()">Copiar la lista como texto</button>'
    + '<button class="btn-recargar" onclick="Equipaje.borrar()">Desmarcar todo</button></div>';

  return html;
}

/* ============================================================
   RETOS — cuestionario del Camino
   Todo local: no hay servidor ni ranking automático. Cada uno juega en su
   móvil y el ranking del grupo se lleva pegando mensajes en WhatsApp.
   ============================================================ */

/* --- Quién juega. Sin contraseña: solo sirve para saber de quién es la
   puntuación guardada en este móvil. --- */
const Persona = {
  CLAVE: 'lolitas2026-persona',
  _foco: null,

  nombre: function(){
    try{ return localStorage.getItem(this.CLAVE) || null; }catch(e){ return null; }
  },
  elegir: function(n){
    try{ localStorage.setItem(this.CLAVE, n); }catch(e){}
    /* Si se eligió desde la ventana, se cierra sola: si no, se queda encima
       tapando el saludo que se acaba de ganar. */
    if(this.dialogoAbierto()) this.cerrarDialogo();
    pintarPanel();
  },
  elegirIdx: function(i){
    const n = PERSONAS[i];
    if(n) this.elegir(n);
  },
  olvidar: function(){
    try{ localStorage.removeItem(this.CLAVE); }catch(e){}
    if(this.dialogoAbierto()) this.cerrarDialogo();
    pintarPanel();
  },

  /* ---- La ventana de "¿Quién eres?" ----
     Misma mecánica que la de "¿Cuánto queda?": un div .modal que se enseña y
     se esconde, con el foco devuelto al cerrar. Se puede abrir desde la
     portada, y desde Retos se sigue usando el panel entero (allí es la
     primera pantalla y no tiene sentido taparla con un diálogo). */
  dialogoAbierto: function(){
    const el = document.getElementById('quien');
    return !!(el && !el.hidden);
  },
  abrirDialogo: function(){
    const el = document.getElementById('quien');
    if(!el) return;
    this._foco = document.activeElement;
    el.hidden = false;
    this.pintarDialogo();
    const x = document.getElementById('quienX');
    if(x) try{ x.focus(); }catch(e){}
  },
  cerrarDialogo: function(){
    const el = document.getElementById('quien');
    if(!el) return;
    el.hidden = true;
    if(this._foco) try{ this._foco.focus(); }catch(e){}
    this._foco = null;
  },
  pintarDialogo: function(){
    const c = document.getElementById('quienCuerpo');
    if(!c) return;
    const yo = this.nombre();
    c.innerHTML = '<h2 id="quienT">¿Quién eres?</h2>'
      + '<div class="nota">Es solo para saludarte por tu nombre y para llevar tu '
      + 'puntuación de los Retos <strong>en este móvil</strong>. No hay contraseña, no se '
      + 'comparte con nadie y se puede cambiar cuando quieras.</div>'
      + '<div class="personas">' + PERSONAS.map(function(p, i){
          return '<button class="persona' + (p === yo ? ' elegida' : '') + '" '
            + 'onclick="Persona.elegirIdx(' + i + ')"'
            + (p === yo ? ' aria-current="true"' : '') + '>' + esc(p) + '</button>';
        }).join('') + '</div>'
      + (yo ? '<div style="text-align:center"><button class="btn-recargar" '
              + 'onclick="Persona.olvidar()">Quitar mi nombre</button></div>' : '');
  }
};

/* ¿Está abierta la tanda de esa fecha? Mismo criterio de fecha que el botón
   "Hoy" (isoHoy, hora local del dispositivo). Las cadenas 'AAAA-MM-DD' se
   comparan bien alfabéticamente. */
function retoDesbloqueado(fechaISO){
  const hoyISO = isoHoy();
  if(hoyISO > fechaISO) return true;
  if(hoyISO === fechaISO && new Date().getHours() >= 16) return true;
  return false;
}

/* --- Respuestas guardadas. Formato en 'lolitas2026-retos':

     { v:1, persona:'Julio',
       respuestas:{ "11": {id:11, opcion:2, acierto:true, ts:'2026-08-18T16:42:10.000Z'} } }

   Cada respuesta es un registro completo (pregunta, opción elegida, acierto y
   marca de tiempo) y el objeto lleva versión de formato y persona. Con eso, si
   algún día esto se sincroniza con un servidor, bastaría con enviar estos
   mismos registros: sería un añadido, no una reescritura. La marca de tiempo
   es la que permitiría menciones tipo "el más madrugador".
   NO hay nada de sincronización ahora: todo se queda en el móvil. --- */
const Retos = {
  CLAVE: 'lolitas2026-retos',
  FORMATO: 1,
  datos: null,

  cargar: function(){
    if(this.datos) return this.datos;
    let d = null;
    try{
      const s = localStorage.getItem(this.CLAVE);
      d = s ? JSON.parse(s) : null;
    }catch(e){ d = null; }
    if(!d || typeof d !== 'object' || !d.respuestas)
      d = {v:this.FORMATO, persona:null, respuestas:{}};
    this.datos = d;
    return d;
  },

  guardar: function(){
    this.datos.persona = Persona.nombre();
    try{ localStorage.setItem(this.CLAVE, JSON.stringify(this.datos)); }
    catch(e){ /* modo privado o sin espacio: se pierde al cerrar, no es grave */ }
  },

  respuesta: function(id){ return this.cargar().respuestas[id] || null; },
  respondida: function(id){ return !!this.respuesta(id); },

  /* Una sola oportunidad: si ya está respondida, no se toca. */
  responder: function(id, opcion, acierto){
    this.cargar();
    if(this.datos.respuestas[id]) return false;
    this.datos.respuestas[id] = {
      id: id, opcion: opcion, acierto: !!acierto, ts: new Date().toISOString()
    };
    this.guardar();
    return true;
  },

  borrarTodo: function(){
    this.datos = {v:this.FORMATO, persona:Persona.nombre(), respuestas:{}};
    try{ localStorage.removeItem(this.CLAVE); }catch(e){}
    ordenRetos = {};
    pintarPanel();
  },

  /* Aciertos de un bloque (0 = previo, 1-6 = etapa) */
  cuenta: function(etapa){
    const lista = RETOS.filter(function(r){ return r.etapa === etapa; });
    let resp = 0, ok = 0;
    lista.forEach(function(r){
      const a = Retos.respuesta(r.id);
      if(a){ resp++; if(a.acierto) ok++; }
    });
    return {aciertos:ok, respondidas:resp, total:lista.length};
  },

  /* Acumulado del viaje: aciertos sobre lo respondido */
  total: function(){
    let resp = 0, ok = 0;
    RETOS.forEach(function(r){
      const a = Retos.respuesta(r.id);
      if(a){ resp++; if(a.acierto) ok++; }
    });
    return {aciertos:ok, respondidas:resp, total:RETOS.length};
  },

  /* Mejor racha de aciertos seguidos, en el orden en que se respondieron */
  racha: function(){
    const d = this.cargar().respuestas;
    const rs = Object.keys(d).map(function(k){ return d[k]; })
      .sort(function(a,b){ return a.ts < b.ts ? -1 : (a.ts > b.ts ? 1 : 0); });
    let mejor = 0, actual = 0;
    rs.forEach(function(a){
      if(a.acierto){ actual++; if(actual > mejor) mejor = actual; }
      else actual = 0;
    });
    return mejor;
  }
};

/* Orden barajado de las opciones, fijo mientras no se recargue la página. */
let ordenRetos = {};

function ordenDeReto(r){
  if(!ordenRetos[r.id]){
    const idx = r.opciones.map(function(_, i){ return i; });
    for(let i = idx.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    ordenRetos[r.id] = idx;
  }
  return ordenRetos[r.id];
}

function responderReto(id, indice){
  const r = RETOS.filter(function(x){ return x.id === id; })[0];
  if(!r || Retos.respondida(id)) return;          /* una sola oportunidad */
  Retos.responder(id, indice, indice === r.correcta);
  pintarPanel();
}

/* Mismo mecanismo que compartir(): compartir nativo, si no al portapapeles,
   y si no se enseña el texto para copiarlo a mano. */
function compartirTexto(texto){
  if(navigator.share){
    navigator.share({title:'Lolitas al Camino', text:texto}).catch(function(){});
  } else if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(function(){
      avisar('Puntuación copiada. Pégala en el grupo de WhatsApp.');
    }).catch(function(){ avisar('No se ha podido copiar el mensaje.'); });
  } else {
    avisar(texto);
  }
}

function textoRetosEtapa(n){
  const c = Retos.cuenta(n), t = Retos.total();
  return 'Lolitas al Camino — Etapa ' + n + '\n'
    + (Persona.nombre() || 'Sin nombre') + ': ' + c.aciertos + ' de ' + c.total + '\n'
    + 'Acumulado del viaje: ' + t.aciertos + ' de ' + t.respondidas;
}

function textoRetosGeneral(){
  const t = Retos.total();
  return 'Lolitas al Camino — Retos\n'
    + (Persona.nombre() || 'Sin nombre') + '\n'
    + 'Acumulado del viaje: ' + t.aciertos + ' de ' + t.respondidas;
}

function tarjetaReto(r){
  const a = Retos.respuesta(r.id);
  const hecha = !!a;

  let html = '<li class="reto' + (hecha ? (a.acierto ? ' bien' : ' mal') : '') + '">'
    + '<p class="reto-p">' + esc(r.pregunta) + '</p><div class="reto-ops">';

  ordenDeReto(r).forEach(function(i){
    let cls = 'reto-op';
    if(hecha){
      if(i === r.correcta) cls += ' ok';
      else if(i === a.opcion) cls += ' ko';
    }
    html += '<button class="' + cls + '"' + (hecha ? ' disabled' : '')
      + ' onclick="responderReto(' + r.id + ',' + i + ')">' + esc(r.opciones[i]) + '</button>';
  });
  html += '</div>';

  if(hecha){
    html += '<div class="reto-rev"><b>' + (a.acierto ? '¡Bien!' : 'Fallaste.') + '</b> '
      + (a.acierto ? '' : 'Marcaste «' + esc(r.opciones[a.opcion])
          + '»; la correcta era «' + esc(r.opciones[r.correcta]) + '». ')
      + esc(r.explicacion) + '</div>';
  } else {
    html += '<p class="reto-aviso">Una sola oportunidad. Piénsalo bien.</p>';
  }
  return html + '</li>';
}

/* Pantalla de "¿quién eres?": sin persona elegida no se juega. */
function panelElegirPersona(){
  return '<div class="et-cab" style="--et:#D8A33C">'
    + '<div class="fecha">Retos</div><h1>¿Quién <em>eres</em>?</h1></div>'

          + esc(p) + '</button>';
      }).join('') + '</div>';

function panelRetos(){
  if(!Persona.nombre()) return panelElegirPersona();

  const yo = Persona.nombre();
  const t = Retos.total();
  const racha = Retos.racha();

  let html = '<div class="et-cab" style="--et:#D8A33C">'
    + '<div class="fecha">Retos · ' + esc(yo) + '</div>'
    + '<h1>Retos de <em>las Lolitas</em></h1>'
    + '<div class="metricas">'
    + '<div class="metrica"><b>' + t.aciertos + '</b><span>aciertos</span></div>'
    + '<div class="metrica"><b>' + t.respondidas + '</b><span>respondidas</span></div>'
    + '<div class="metrica"><b>' + t.total + '</b><span>preguntas</span></div>'
    + '</div></div>';

  if(racha >= 3)
    html += '<div class="reto-mencion">Racha de ' + racha + ' aciertos seguidos.</div>';

  html += '<button class="reto-wa" onclick="compartirTexto(textoRetosGeneral())">'
    + 'Compartir mi puntuación por WhatsApp</button>';

  html += '<div class="nota"><b>Cómo va esto:</b> cada uno juega en su móvil y las '
    + 'respuestas se guardan solo ahí. No hay servidor ni ranking automático: el '
    + 'ranking del grupo se lleva en el chat, pulsando «compartir» y pegando el mensaje en '
    + 'WhatsApp. Y ojo, <b>una sola oportunidad por pregunta</b>.</div>';

  /* --- Bloque 1 --- */
  const c0 = Retos.cuenta(0);
  html += '<h2>Prepara el Camino</h2>'
    + '<div class="reto-marcador"><b>' + c0.aciertos + ' de ' + c0.respondidas + '</b>'
    + '<span>de ' + c0.total + ' preguntas</span></div>'
    + '<ul class="retos">'
    + RETOS.filter(function(r){ return r.etapa === 0; }).map(tarjetaReto).join('')
    + '</ul>';

  /* --- Bloque 2 --- */
  html += '<h2>Lo que has visto hoy</h2>';
  ETAPAS.forEach(function(e){
    const preg = RETOS.filter(function(r){ return r.etapa === e.num; });
    if(!preg.length) return;
    const abierto = retoDesbloqueado(e.fecha);
    const c = Retos.cuenta(e.num);

    html += '<div class="reto-tanda' + (abierto ? '' : ' bloqueada') + '">'
      + '<p class="reto-tanda-t">Etapa ' + e.num + ' · ' + esc(e.origen)
      + ' → ' + esc(e.destino) + '</p>';

    if(!abierto){
      /* Bloqueada: solo pistas, nunca las preguntas. */
      html += '<p class="reto-tanda-s">Se abre el ' + esc(e.diaSemana) + ' '
        + e.fecha.slice(8) + ' a las 16:00</p><ul class="reto-pistas">'
        + preg.map(function(r){ return '<li>' + esc(r.pista) + '</li>'; }).join('')
        + '</ul>';
    } else {
      html += '<p class="reto-tanda-s">' + c.aciertos + ' de ' + c.respondidas
        + ' aciertos · ' + c.total + ' preguntas</p>';
      if(c.respondidas === c.total && c.aciertos === c.total)
        html += '<div class="reto-mencion">¡Pleno en la etapa ' + e.num + '!</div>';
      html += '<ul class="retos">' + preg.map(tarjetaReto).join('') + '</ul>';
      if(c.respondidas === c.total)
        html += '<button class="reto-wa" onclick="compartirTexto(textoRetosEtapa('
          + e.num + '))">Compartir la etapa ' + e.num + ' por WhatsApp</button>';
    }
    html += '</div>';
  });

  /* Botones discretos: cambiar de persona y empezar de cero. */
  html += '<div class="reto-pie">'
    + '<button class="btn-recargar" onclick="Persona.olvidar()">Cambiar de persona</button>'
    + '<button class="btn-recargar" onclick="if(confirm(\'¿Empezar de cero? Se borran '
    + 'tus respuestas guardadas en este móvil.\'))Retos.borrarTodo()">Empezar de cero</button>'
    + '</div>';
  return html;
}

/* ¿Este taxi sirve para la etapa n? (etapa suelta o lista) */
function taxiEnEtapa(t, n){
  return !t.etapa || t.etapa === n || (Array.isArray(t.etapa) && t.etapa.indexOf(n) >= 0);
}

/* Tarjeta de teléfono de un taxi, con la zona y la marca de verificación. */
function taxiTel(t){
  const marcas = [];
  if(t.zona) marcas.push(esc(t.zona));
  if(t.nota) marcas.push(esc(t.nota));
  if(t.verif === false) marcas.push('sin verificar por teléfono');
  const em = marcas.length ? '<em> · ' + marcas.join(' · ') + '</em>' : '';
  return '<a href="tel:' + t.tel.replace(/\s/g,'') + '" class="tel">'
    + '<span class="tel-n">' + esc(t.nombre) + em + '</span>'
    + '<span class="tel-t">' + esc(t.tel) + '</span></a>';
}

function moverSlider(v){

    datos.innerHTML = '<div><b>'+kmSlider.toFixed(1)+'</b><span>km hechos</span></div>'
      + '<div><b>'+rest.toFixed(1)+'</b><span>km quedan</span></div>'
      + '<div><b>'+Math.round(info.ele)+'</b><span>metros</span></div>'
      + '<div><b>'+((info.pendiente>=0?'+':'')+info.pendiente.toFixed(1))
      + '%</b><span>inclinación</span></div>';

/* Convierte la coordenada X del toque en un kilómetro de la etapa */
function kmDesdeEvento(ev, kmMax, mI, gW){
  const svg = ev.target.ownerSVGElement || ev.target;
  const caja = svg.getBoundingClientRect();
  const escala = caja.width / svg.viewBox.baseVal.width;
  const xSvg = (ev.clientX - caja.left) / escala;
  const f = Math.max(0, Math.min(1, (xSvg - mI) / gW));
  return Math.round(f * kmMax * 10) / 10;
}

function tocarPerfil(ev, kmMax, mI, gW){
  moverSlider(kmDesdeEvento(ev, kmMax, mI, gW));
  const r = document.querySelector('.slider-caja input[type=range]');
  if(r) r.value = kmSlider;
}

function arrastrarPerfil(ev, kmMax, mI, gW){
  /* Solo mientras se mantiene pulsado */
  if(ev.buttons !== 1 && ev.pointerType !== 'touch') return;
  if(ev.pointerType === 'touch' && !ev.isPrimary) return;
  ev.preventDefault();
  tocarPerfil(ev, kmMax, mI, gW);
}

function mostrarMapa(si){
  const m = document.getElementById('main');
  m.classList.toggle('mapa', si);
  /* Clase en <body> para poder flotar la nav (que está FUERA de #main) sobre el
     mapa a pantalla completa. Al salir del mapa, la barra vuelve a verse. */
  document.body.classList.toggle('vista-mapa', si);
  if(!si) document.body.classList.remove('nav-oculta');
  if(si){
    /* La barra flotante empuja hacia abajo los controles del mapa; su alto
       real se mide aquí y se expone como --nav-h para el CSS. */
    const nav = document.getElementById('nav');
    if(nav) document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
  }
  document.getElementById('verMapa').textContent = si ? 'Ver ficha' : 'Ver mapa';
  /* En móvil el mapa pasa de display:none a visible. MapLibre no se entera
     del cambio de tamaño solo, y se queda dibujado en una franja. Hay que
     llamar a resize() DESPUÉS de que el navegador haya recolocado el
     contenedor: por eso el doble requestAnimationFrame (espera al reflow)
     más una red de seguridad por si iOS tarda. No se condiciona a mapaListo:
     resize() es inofensivo en cuanto el mapa existe (va en try/catch). */
  if(si && mapa){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ try{ mapa.resize(); }catch(e){} });
    });
    setTimeout(function(){ try{ mapa.resize(); }catch(e){} }, 300);
  }
}

function pintarCuenta(){

  if(ms > 0){

      + String(min % 60).padStart(2,'0') + ' min</b>para Santiago';

    + Number(ETAPAS[ETAPAS.length-1].fecha.slice(8)) + ' de agosto, '
    + horaLlegadaSantiago();
