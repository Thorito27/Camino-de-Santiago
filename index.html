/* Hora de llegada a Santiago segun el horario de la tita Lucila. Se busca en
   el timing de la ultima etapa en vez de escribirla a mano, para que siga a
   los datos si cambian. */
/* Es la llegada de la última etapa, ni más ni menos. Se delega en
   `horaLlegadaEtapa` para no tener dos maneras de calcular lo mismo, que es
   como acaban discrepando. Da 13:30, igual que la versión que había antes;
   hay una prueba que lo fija. */
function horaLlegadaSantiago(){
  return horaLlegadaEtapa(ETAPAS.length) || ETAPAS[ETAPAS.length-1].salida || '00:00';
}

/* Instante exacto al que apunta la cuenta atras. */
function metaSantiago(){
  const e = ETAPAS[ETAPAS.length-1];
  const f = e.fecha.split('-').map(Number);
  const hm = horaLlegadaSantiago().split(':').map(Number);
  return new Date(f[0], f[1]-1, f[2], hm[0] || 0, hm[1] || 0, 0, 0);
}

/* ============================================================
   RECADO DEL GRUPO
   Ventana que sale al abrir la web, CADA VEZ (no se recuerda que ya la
   viste: es un recado corto y se quiere que lo lea todo el mundo). Misma
   mecánica que las otras dos ventanas: Esc cierra, el fondo cierra y las
   flechas no navegan por detrás.

   Se llama `Recado` y su elemento es `#recado` A PROPÓSITO. Nació como
   `#aviso` y no se veía: ese id ya era el de los mensajitos flotantes de
   `avisar()`, cuyo CSS lleva `opacity:0` hasta que se le añade `.visible`.
   Como un `#id` pesa más que una clase, la ventana salía abierta y
   totalmente transparente; y además `avisar()` la habría machacado con un
   `textContent`. jsdom no calcula estilos y no lo cazó: lo vio un Chromium.

   QUÉ CUENTA COMO "ENTRAR A LA WEB". No solo cargar la página. En el móvil
   la pestaña se queda abierta días, así que también cuenta **volver a la web
   desde otra app** o desde la pantalla bloqueada. Por eso hay tres puertas:
   el arranque, `pageshow` (volver con el botón atrás, que restaura la página
   sin reejecutar el arranque) y `visibilitychange` (volver a primer plano).
   Moverse por las pestañas de la propia web NO cuenta: no se ha vuelto a
   entrar, se sigue dentro.

   PARA CAMBIARLO O QUITARLO, solo hay que tocar aquí:
   - cambiar el recado → cambia TEXTO (y el emoji de ICONO si quieres).
   - quitarlo del todo  → pon TEXTO a '' y deja de salir; no hay que borrar
     nada más, ni el HTML ni el arranque.
   - si sale demasiado → sube MINUTOS_DESCANSO (en 0 sale siempre, que es lo
     que se pidió: cada vez que se entra).
   El texto se escapa con esc(), así que puede llevar comillas o < sin
   romper la página.
   ============================================================ */
const Recado = {
  /* 🤦🏼‍♂️ = persona con la mano en la cara */
  TEXTO: 'Pablo se ha olvidado los zapatos para caminar!!',
  ICONO: '🤦🏼‍♂️',
  /* Minutos mínimos entre dos apariciones. 0 = cada vez que se entra, sin
     excepción. Súbelo a 10 o 30 si en el Camino se hace pesado al ir y venir
     de WhatsApp; no hace falta tocar nada más. */
  MINUTOS_DESCANSO: 0,
  _foco: null,
  _ultima: 0,

  hayRecado: function(){ return !!(this.TEXTO && this.TEXTO.trim()); },
  abierto: function(){
    const el = document.getElementById('recado');
    return !!(el && !el.hidden);
  },
  abrir: function(){
    if(!this.hayRecado()) return;
    if(this.abierto()) return;              /* ya está puesto: no repintar ni robar el foco */
    /* El descanso solo frena las reapariciones; la primera vez (_ultima = 0)
       sale siempre, valga lo que valga MINUTOS_DESCANSO. */
    if(this.MINUTOS_DESCANSO > 0 && this._ultima
       && Date.now() - this._ultima < this.MINUTOS_DESCANSO * 60000) return;
    const el = document.getElementById('recado');
    const c  = document.getElementById('recadoCuerpo');
    if(!el || !c) return;
    this._ultima = Date.now();
    c.innerHTML = '<div class="recado-ico" aria-hidden="true">' + this.ICONO + '</div>'
      + '<p class="recado-t" id="recadoT">' + esc(this.TEXTO) + '</p>'
      + '<button class="recado-ok" type="button" onclick="Recado.cerrar()">Vale</button>';
    this._foco = document.activeElement;
    el.hidden = false;
    const b = c.querySelector('.recado-ok');
    if(b) try{ b.focus(); }catch(e){}
  },
  cerrar: function(){
    const el = document.getElementById('recado');
    if(!el) return;
    el.hidden = true;
    if(this._foco) try{ this._foco.focus(); }catch(e){}
    this._foco = null;
  },

  /* Las otras dos puertas de entrada, además del arranque. Se registran una
     sola vez, desde `vigilar()`. */
  vigilar: function(){
    const yo = this;
    /* Volver con el botón atrás: el navegador restaura la página tal cual y
       NO vuelve a ejecutar el arranque, así que sin esto no saldría. */
    window.addEventListener('pageshow', function(e){
      if(e.persisted) yo.abrir();
    });
    /* Volver a la web desde otra app, o desbloquear el móvil con la pestaña
       abierta. Es la forma de "entrar" más común en el móvil. */
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'visible') yo.abrir();
    });
  }
};

/* Flechas del teclado para cambiar de etapa */
document.addEventListener('keydown', function(e){
  if(e.target && e.target.tagName === 'INPUT') return;
  /* Con la ventana de "¿Cuánto queda?" abierta, Esc la cierra y las flechas
     NO cambian de etapa: se estaría navegando por detrás de un diálogo. */
  if(typeof Queda !== 'undefined' && Queda.abierto()){
    if(e.key === 'Escape') Queda.cerrar();
    return;
  }
  /* Lo mismo con la de "¿Quién eres?": si no, se navega por detrás del
     diálogo y al cerrarlo has cambiado de etapa sin querer. */
  if(typeof Persona !== 'undefined' && Persona.dialogoAbierto()){
    if(e.key === 'Escape') Persona.cerrarDialogo();
    return;
  }
  /* Y con el aviso del grupo, igual. Van ya TRES ventanas que interceptan
     el teclado; si añades otra, acuérdate de este bloque. */
  if(typeof Recado !== 'undefined' && Recado.abierto()){
    if(e.key === 'Escape') Recado.cerrar();
    return;
  }
  if(e.key === 'ArrowRight' && vistaEtapa < 8) irA(vistaEtapa+1);
  else if(e.key === 'ArrowLeft' && vistaEtapa > 0) irA(vistaEtapa-1);
});


/* ============================================================
   SIN COBERTURA
   Registra el service worker y permite descargar por adelantado
   los tiles de las seis etapas.
   ============================================================ */
let sw = null;

/* Cuántos fragmentos de mapa hay ya guardados. `null` = todavía no se le ha
   preguntado al service worker. Se guarda aquí porque el panel del índice se
   repinta entero cada vez que se navega: sin esto, al volver al índice se
   leía «Sin descargar todavía» aunque los mapas estuvieran guardados, y daba
   la impresión de que había que descargarlos otra vez. */
let tilesGuardados = null;

function textoEstadoDesc(){
  if(tilesGuardados === null) return 'Comprobando qué hay guardado…';
  if(tilesGuardados === 0)    return 'Sin descargar todavía.';
  return tilesGuardados + ' fragmentos de mapa ya guardados en este móvil. '
       + 'Se conservan al actualizarse la web; no hay que volver a bajarlos.';
}

/* Refresca el bloque de descarga si está pintado ahora mismo */
function pintarEstadoDesc(){
  const t  = document.getElementById('estadoDesc');
  const bt = document.getElementById('btnDesc');
  const b  = document.getElementById('barraDesc');
  if(t)  t.textContent = textoEstadoDesc();
  if(b && tilesGuardados > 0) b.style.width = '100%';
  if(bt && !bt.disabled && tilesGuardados > 0) bt.textContent = 'Volver a guardar';
}

/* Le pregunta al service worker cuántos tiles tiene guardados */
function pedirEstadoTiles(){
  if(!('serviceWorker' in navigator)) return;
  if(!navigator.serviceWorker.controller) return;
  navigator.serviceWorker.controller.postMessage({tipo:'estado'});
}

function registrarSW(){
  if(!('serviceWorker' in navigator)) return;
  /* Con file:// no funciona: hace falta http(s) */
  if(location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then(function(reg){
    sw = reg;
    navigator.serviceWorker.addEventListener('message', function(e){
      if(!e.data) return;
      if(e.data.tipo === 'precacheado'){
        const b = document.getElementById('barraDesc');
        const t = document.getElementById('estadoDesc');
        const bt = document.getElementById('btnDesc');
        tilesGuardados = e.data.hechos;
        if(b) b.style.width = '100%';
        if(t) t.textContent = 'Listo: ' + e.data.hechos + ' fragmentos de mapa guardados. '
                            + 'Ya funciona sin conexión.';
        if(bt){ bt.disabled = false; bt.textContent = 'Volver a guardar'; }
      }
      if(e.data.tipo === 'estado'){
        tilesGuardados = e.data.tiles;
        pintarEstadoDesc();
      }
    });
    pedirEstadoTiles();
    /* La primera visita se registra sin controlador: el service worker toma el
       control unos instantes después y solo entonces se le puede preguntar. */
    navigator.serviceWorker.addEventListener('controllerchange', pedirEstadoTiles);
  }).catch(function(){ /* sin service worker se sigue navegando normal */ });
}

/* Convierte lon/lat a coordenadas de tile en un zoom dado */
function aTile(lon, lat, z){
  const n = Math.pow(2, z);
  const x = Math.floor((lon + 180) / 360 * n);
  const rad = lat * Math.PI / 180;
  const y = Math.floor((1 - Math.log(Math.tan(rad) + 1/Math.cos(rad)) / Math.PI) / 2 * n);
  return {x:x, y:y, z:z};
}

/* Lista de tiles que cubren las trazas.
   z12 para la vista general, z14 para seguir el camino, y z15 solo
   alrededor de los pueblos y puntos de escape, que es donde hace
   falta detalle. Así la descarga baja de 900 a unos 400 fragmentos. */
function tilesDeLaRuta(){
  const set = {};

  for(let n=1; n<=6; n++){
    if(!TRAZAS[n]) continue;

    /* Toda la traza en zoom general y de seguimiento */
    TRAZAS[n].linea.forEach(function(q){
      [12, 14].forEach(function(z){
        const t = aTile(q[0], q[1], z);
        const r = z === 14 ? 1 : 0;
        for(let dx=-r; dx<=r; dx++){
          for(let dy=-r; dy<=r; dy++){
            set[z+'/'+(t.x+dx)+'/'+(t.y+dy)] = [z, t.x+dx, t.y+dy];
          }
        }
      });
    });

    /* Detalle fino solo en los hitos con nombre */
    ETAPAS[n-1].puntos.forEach(function(p){
      if(p.tipo === 'paso') return;
      const t = aTile(p.lon, p.lat, 15);
      for(let dx=-1; dx<=1; dx++){
        for(let dy=-1; dy<=1; dy++){
          set['15/'+(t.x+dx)+'/'+(t.y+dy)] = [15, t.x+dx, t.y+dy];
        }
      }
    });
  }
  /* Solo el satélite (PNOA) y el relieve. La capa topográfica se retiró: no
     compensaba duplicar la descarga. */
  const urls = [];
  Object.keys(set).forEach(function(k){
    const t = set[k], z = t[0], x = t[1], y = t[2];
    urls.push(URL_PNOA.replace('{z}', z).replace('{x}', x).replace('{y}', y));
    if(z <= 12){
      urls.push('https://s3.amazonaws.com/elevation-tiles-prod/terrarium/'
                + z + '/' + x + '/' + y + '.png');
    }
  });
  return urls;
}

/* Peso aproximado de una lista de teselas, en MB. Los pesos medios están
   medidos sobre teselas reales del recorrido, no inventados. */
function estimaMB(urls){
  let b = 0;
  urls.forEach(function(u){
    if(u.indexOf('elevation-tiles-prod') >= 0) b += 118000;
    else b += 14000;
  });
  return b / 1048576;
}

function descargarMapas(){
  if(location.protocol === 'file:'){
    avisar('Esto solo funciona con la web publicada, no abriendo el archivo directamente.');
    return;
  }
  if(!navigator.serviceWorker || !navigator.serviceWorker.controller){
    avisar('Recarga la página una vez y vuelve a intentarlo.');
    return;
  }
  const urls = tilesDeLaRuta();
  /* Estimación de espacio, medida sobre teselas reales de la ruta:
     PNOA ~14 KB, OpenTopoMap ~30 KB, relieve ~118 KB. */
  const mb = Math.round(estimaMB(urls));
  if(mb > 150 && !confirm('La descarga ocupará unos ' + mb + ' MB. Conviene hacerla '
      + 'con wifi y espacio libre. ¿Seguimos?')) return;

  const bt = document.getElementById('btnDesc');
  const t  = document.getElementById('estadoDesc');
  const b  = document.getElementById('barraDesc');
  if(bt){ bt.disabled = true; bt.textContent = 'Descargando…'; }
  if(t) t.textContent = 'Guardando ' + urls.length + ' fragmentos de mapa, unos '
                      + mb + ' MB. Puede tardar un par de minutos, no cierres la página.';
  if(b) b.style.width = '15%';
  navigator.serviceWorker.controller.postMessage({tipo:'precachear', urls:urls});
}

  actualizar();
}

/* Diagnóstico en pantalla, SOLO si la URL lleva ?debug. Pensado para poder
   depurar el mapa desde el propio móvil, sin Mac ni consola: muestra la
   versión cargada y las medidas reales del contenedor y del lienzo del mapa.
   Si el lienzo es mucho más bajo que el contenedor, es que no se ha
   redimensionado; si webgl=no, el problema es otro. */
function diagnostico(){
  if(!new URLSearchParams(location.search).has('debug')) return;
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:6px;bottom:6px;z-index:99999;max-width:94vw;'
    + 'background:rgba(10,15,12,.93);color:#EDE8DC;font:11px/1.5 monospace;padding:8px 10px;'
    + 'border:1px solid #7FA98A;border-radius:5px;white-space:pre;pointer-events:none';
  document.body.appendChild(box);
  function webgl(){
    try{ const c = document.createElement('canvas');
      return !!(c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl'));
    }catch(e){ return false; }
  }
  function upd(){
    const m = document.getElementById('mapa');
    const r = m ? m.getBoundingClientRect() : {width:0, height:0};
    let cw = 0, ch = 0;
    try{ if(mapa){ const cv = mapa.getCanvas(); cw = cv.width; ch = cv.height; } }catch(e){}
    box.textContent =
        'build ' + APP_VERSION + '   dpr ' + (window.devicePixelRatio || 1) + '\n'
      + 'ventana   ' + Math.round(window.innerWidth) + ' x ' + Math.round(window.innerHeight) + '\n'
      + 'contenedor ' + Math.round(r.width) + ' x ' + Math.round(r.height) + '\n'
      + 'lienzo     ' + cw + ' x ' + ch + '\n'
      + 'mapaListo ' + (typeof mapaListo !== 'undefined' && mapaListo)
      + '   webgl ' + webgl() + '\n'
      + 'vistaMapa ' + document.getElementById('main').classList.contains('mapa') + '\n'
      + 'tiles     ' + (tilesGuardados === null ? '?' : tilesGuardados) + ' guardados';
  }
  upd();
  setInterval(upd, 700);
  /* Refresca la cuenta de tiles sin depender de que el índice esté pintado */
  setInterval(pedirEstadoTiles, 3000);
}

</script>
</body>
</html>
